<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lark Base Weighted Metric - Tỷ lệ Quảng cáo</title>
  <style>
    :root {
      --bg-color: #ffffff;
      --text-primary: #1f2329;
      --text-secondary: #646a73;
      --text-muted: #8f959e;
      --border-color: #dee0e3;
      --accent-color: #3370ff;
      --accent-hover: #245bdb;
      --danger-color: #f54a45;
      --panel-bg: #f8f9fa;
    }

    body[data-theme="dark"] {
      --bg-color: #191919;
      --text-primary: #f0f0f0;
      --text-secondary: #a6a6a6;
      --text-muted: #757575;
      --border-color: #303030;
      --panel-bg: #242424;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-primary);
      overflow: hidden;
    }

    .app-container {
      display: flex;
      width: 100%;
      height: 100%;
    }

    /* THẺ METRIC HIỂN THỊ TRÊN DASHBOARD */
    .metric-card {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 14px 18px;
      min-width: 0;
    }

    .metric-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .metric-value {
      font-size: clamp(24px, 5vw, 36px);
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.15;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .metric-value.err {
      font-size: 13px;
      font-weight: 500;
      color: var(--danger-color);
      white-space: normal;
    }

    .metric-sub {
      font-size: 11.5px;
      color: var(--text-muted);
      margin-top: 6px;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* PANEL CHỌN NGUỒN (CHỈ HIỆN Ở TRẠNG THÁI CREATE / CONFIG) */
    .config-panel {
      width: 320px;
      border-left: 1px solid var(--border-color);
      background-color: var(--panel-bg);
      padding: 16px;
      display: none;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
    }

    .app-container.is-config .config-panel {
      display: flex;
    }

    .config-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border-color);
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .form-group label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .form-group select,
    .form-group input {
      width: 100%;
      padding: 8px 10px;
      font-size: 13px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      background-color: var(--bg-color);
      color: var(--text-primary);
      outline: none;
    }

    .form-group select:focus,
    .form-group input:focus {
      border-color: var(--accent-color);
    }

    .hint-box {
      font-size: 11.5px;
      line-height: 1.45;
      color: var(--text-secondary);
      background: rgba(51, 112, 255, 0.08);
      border-radius: 6px;
      padding: 8px 10px;
    }

    .btn-save {
      margin-top: auto;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 600;
      color: #ffffff;
      background-color: var(--accent-color);
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    .btn-save:hover { background-color: var(--accent-hover); }
    .btn-save:disabled { opacity: 0.6; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="app-container" id="app-container">
    <!-- Khối hiển thị Thẻ Metric -->
    <div class="metric-card">
      <div class="metric-label" id="metric-label">TỶ LỆ QUẢNG CÁO</div>
      <div class="metric-value" id="metric-val">Đang tải...</div>
      <div class="metric-sub" id="metric-sub"></div>
    </div>

    <!-- Khối chọn Nguồn dữ liệu (Chỉ hiện khi Thêm mới hoặc bấm Cấu hình) -->
    <div class="config-panel">
      <div class="config-title">Cấu hình Nguồn & Công thức (∑A / ∑B)</div>

      <div class="form-group">
        <label for="cfg-table">1. Bảng dữ liệu nguồn</label>
        <select id="cfg-table"></select>
      </div>

      <div class="form-group">
        <label for="cfg-range">2. Phạm vi dữ liệu</label>
        <select id="cfg-range"></select>
      </div>

      <div class="form-group">
        <label for="cfg-num">3. Cột Tử số (∑ Chi phí Quảng cáo)</label>
        <select id="cfg-num"></select>
      </div>

      <div class="form-group">
        <label for="cfg-den">4. Cột Mẫu số (∑ Doanh thu thuần)</label>
        <select id="cfg-den"></select>
      </div>

      <div class="form-group">
        <label for="cfg-title">5. Tiêu đề thẻ</label>
        <input type="text" id="cfg-title" value="TỶ LỆ QUẢNG CÁO" />
      </div>

      <div class="hint-box">
        💡 Sau khi bấm <b>Lưu cấu hình</b>, đừng quên kiểm tra các bộ lọc Slicer (<b>SHOP</b>, <b>THỜI GIAN</b>) trên Dashboard đã tick chọn áp dụng cho khối này nhé!
      </div>

      <button class="btn-save" id="btn-save">Xác nhận & Lưu cấu hình</button>
    </div>
  </div>

  <script type="module">
    async function loadBitableSDK() {
      for (const url of [
        'https://cdn.jsdelivr.net/npm/@lark-base-open/js-sdk@1.0.2/+esm',
        'https://esm.sh/@lark-base-open/js-sdk@1.0.2'
      ]) {
        try { return await import(url); } catch (_) {}
      }
      throw new Error('Không thể tải @lark-base-open/js-sdk từ CDN.');
    }

    const appEl = document.getElementById('app-container');
    const labelEl = document.getElementById('metric-label');
    const valEl = document.getElementById('metric-val');
    const subEl = document.getElementById('metric-sub');

    const tableSelect = document.getElementById('cfg-table');
    const rangeSelect = document.getElementById('cfg-range');
    const numSelect = document.getElementById('cfg-num');
    const denSelect = document.getElementById('cfg-den');
    const titleInput = document.getElementById('cfg-title');
    const saveBtn = document.getElementById('btn-save');

    const vnNumFmt = new Intl.NumberFormat('vi-VN', { maximumFractionDigits: 0 });
    const vnPctFmt = new Intl.NumberFormat('vi-VN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const norm = (s) => String(s || '').normalize('NFC').trim().toUpperCase();

    function renderMetric(adsVal, revVal, title) {
      if (title) labelEl.textContent = title;
      const a = typeof adsVal === 'number' ? adsVal : (parseFloat(String(adsVal ?? '0')) || 0);
      const b = typeof revVal === 'number' ? revVal : (parseFloat(String(revVal ?? '0')) || 0);
      const ratio = b > 0 ? (a / b) * 100 : 0;

      valEl.className = 'metric-value';
      valEl.textContent = `${vnPctFmt.format(ratio)}%`;
      subEl.textContent = `Ads: ${vnNumFmt.format(a)} / DT: ${vnNumFmt.format(b)}`;
    }

    // Tạo IDataCondition chuẩn (TUYỆT ĐỐI KHÔNG CÓ groups: [] để không bị lỗi "Nguồn dữ liệu đã thay đổi")
    function createCondition(tableId, dataRangeObj, numFieldId, denFieldId, Rollup, SourceType) {
      const sumRollup = Rollup?.SUM || 'SUM';
      const validRange = dataRangeObj || { type: SourceType?.ALL || 'ALL' };
      return {
        tableId,
        dataRange: validRange,
        series: [
          { fieldId: numFieldId, rollup: sumRollup },
          { fieldId: denFieldId, rollup: sumRollup }
        ]
      };
    }

    // Tự động chọn đúng cột CHI PHÍ ADS BAO GỒM VAT và DOANH THU THUẦN trong bảng
    function findBestDefaultFields(fields) {
      const adsField =
        fields.find(f => norm(f.name) === 'CHI PHÍ ADS BAO GỒM VAT') ||
        fields.find(f => norm(f.name).startsWith('CHI PHÍ ADS')) ||
        fields.find(f => norm(f.name).startsWith('CHI PHÍ QUẢNG CÁO')) ||
        fields.find(f => norm(f.name).includes('CHI PHÍ')) ||
        fields[0];

      const revField =
        fields.find(f => norm(f.name) === 'DOANH THU THUẦN') ||
        fields.find(f => norm(f.name).includes('DOANH THU THUẦN')) ||
        fields.find(f => norm(f.name) === 'NMV') ||
        fields.find(f => norm(f.name) === 'GMV') ||
        fields.find(f => f.id !== adsField?.id) ||
        fields[0];

      return {
        adsFieldId: adsField?.id || '',
        revFieldId: revField?.id || ''
      };
    }

    // Lọc bỏ các cột chữ/ngày tháng (như TÊN SHOP, NGÀY, THÁNG) để tránh chọn nhầm gây lỗi SUM
    function filterValidNumericFields(fieldMetaList, FieldType) {
      const numericTypes = new Set([
        FieldType?.Number ?? 2,
        FieldType?.Formula ?? 20,
        FieldType?.Lookup ?? 19,
        FieldType?.Currency ?? 99003,
        FieldType?.Progress ?? 99002,
        FieldType?.Rating ?? 99004
      ]);
      const filtered = fieldMetaList.filter(f => {
        const n = norm(f.name);
        if (n === 'TÊN SHOP' || n === 'SHOP' || n.startsWith('NGÀY') || n.startsWith('THÁNG')) {
          return false;
        }
        return numericTypes.has(f.type);
      });
      return filtered.length >= 2 ? filtered : fieldMetaList;
    }

    async function main() {
      try {
        const sdk = await loadBitableSDK();
        const { bitable, DashboardState, Rollup, SourceType, FieldType } = sdk;
        const { dashboard, base } = bitable;

        // Đồng bộ theme Sáng / Tối
        try {
          const initTheme = await dashboard.getTheme();
          document.body.setAttribute('data-theme', (initTheme?.theme || '').toLowerCase() === 'dark' ? 'dark' : 'light');
          dashboard.onThemeChange(ev => {
            document.body.setAttribute('data-theme', (ev.data?.theme || '').toLowerCase() === 'dark' ? 'dark' : 'light');
          });
        } catch (_) {}

        const state = dashboard.state;
        const isConfigMode =
          state === DashboardState.Create ||
          state === DashboardState.Config ||
          window.location.href.includes('isCreate=1') ||
          window.location.href.includes('isConfig=1');

        if (isConfigMode) {
          appEl.classList.add('is-config');
          await initConfigMode({ base, dashboard, DashboardState, Rollup, SourceType, FieldType });
        } else {
          appEl.classList.remove('is-config');
          await initViewMode({ dashboard });
        }
      } catch (err) {
        valEl.className = 'metric-value err';
        valEl.textContent = 'Lỗi khởi tạo: ' + (err?.message || String(err));
      }
    }

    // ================= CHẾ ĐỘ CẤU HÌNH (CREATE / CONFIG) =================
    async function initConfigMode({ base, dashboard, DashboardState, Rollup, SourceType, FieldType }) {
      const tableMetaList = await base.getTableMetaList();
      tableSelect.innerHTML = tableMetaList
        .map(t => `<option value="${t.id}">${t.name}</option>`)
        .join('');

      // Ưu tiên bảng TRACKING ALL
      const defaultTable =
        tableMetaList.find(t => norm(t.name).includes('TRACKING ALL')) ||
        tableMetaList.find(t => norm(t.name).includes('TRACKING')) ||
        tableMetaList[0];

      let currentTableId = defaultTable?.id || '';
      let currentRangeJson = '';
      let currentNumId = '';
      let currentDenId = '';
      let currentTitle = 'TỶ LỆ QUẢNG CÁO';

      // Nếu đang bấm sửa cấu hình đã lưu -> nạp lại cấu hình cũ (nếu hợp lệ)
      if (dashboard.state === DashboardState.Config) {
        try {
          const saved = await dashboard.getConfig();
          const cond = saved?.dataConditions?.[0];
          if (cond?.tableId && tableMetaList.some(t => t.id === cond.tableId)) {
            currentTableId = cond.tableId;
          }
          if (cond?.dataRange) {
            currentRangeJson = JSON.stringify(cond.dataRange);
          }
          if (Array.isArray(cond?.series) && cond.series.length >= 2) {
            // Chỉ khôi phục nếu 2 cột cũ khác nhau (tránh lỗi trùng cột CLICK cũ)
            if (cond.series[0].fieldId !== cond.series[1].fieldId) {
              currentNumId = cond.series[0].fieldId;
              currentDenId = cond.series[1].fieldId;
            }
          }
          if (saved?.customConfig?.title) {
            currentTitle = String(saved.customConfig.title);
          }
        } catch (_) {}
      }

      titleInput.value = currentTitle;
      tableSelect.value = currentTableId;

      async function loadTableFieldsAndRanges(tableId, useSavedSelection) {
        const [dataRanges, table] = await Promise.all([
          dashboard.getTableDataRange(tableId),
          base.getTableById(tableId)
        ]);
        const rawFields = await table.getFieldMetaList();
        const numericFields = filterValidNumericFields(rawFields, FieldType);

        rangeSelect.innerHTML = dataRanges
          .map(r => {
            const label = r.type === (SourceType?.ALL || 'ALL') ? 'Tất cả dữ liệu' : `View: ${r.viewName || r.viewId}`;
            return `<option value='${JSON.stringify(r)}'>${label}</option>`;
          })
          .join('');

        const fieldOptions = numericFields
          .map(f => `<option value="${f.id}">${f.name}</option>`)
          .join('');
        numSelect.innerHTML = fieldOptions;
        denSelect.innerHTML = fieldOptions;

        const defaults = findBestDefaultFields(numericFields);
        numSelect.value = defaults.adsFieldId;
        denSelect.value = defaults.revFieldId;

        if (useSavedSelection) {
          if (currentRangeJson && [...rangeSelect.options].some(o => o.value === currentRangeJson)) {
            rangeSelect.value = currentRangeJson;
          }
          if (currentNumId && numericFields.some(f => f.id === currentNumId)) {
            numSelect.value = currentNumId;
          }
          if (currentDenId && numericFields.some(f => f.id === currentDenId)) {
            denSelect.value = currentDenId;
          }
        }
      }

      async function updatePreview() {
        const tId = tableSelect.value;
        const aId = numSelect.value;
        const bId = denSelect.value;
        const title = titleInput.value.trim() || 'TỶ LỆ QUẢNG CÁO';
        if (!tId || !aId || !bId) return;

        let rangeObj = { type: SourceType?.ALL || 'ALL' };
        try { rangeObj = JSON.parse(rangeSelect.value); } catch (_) {}

        try {
          const cond = createCondition(tId, rangeObj, aId, bId, Rollup, SourceType);
          const pData = await dashboard.getPreviewData(cond);

          if (Array.isArray(pData?.[1]) && pData[1].length >= 2) {
            renderMetric(pData[1][0]?.value, pData[1][1]?.value, title);
          } else {
            // Nếu 2 cột trùng nhau hoặc cần lấy riêng lẻ
            const sumRollup = Rollup?.SUM || 'SUM';
            const [resA, resB] = await Promise.all([
              dashboard.getPreviewData({ tableId: tId, dataRange: rangeObj, series: [{ fieldId: aId, rollup: sumRollup }] }),
              dashboard.getPreviewData({ tableId: tId, dataRange: rangeObj, series: [{ fieldId: bId, rollup: sumRollup }] })
            ]);
            renderMetric(resA?.[1]?.[0]?.value, resB?.[1]?.[0]?.value, title);
          }
        } catch (err) {
          console.error('Preview error:', err);
        }
      }

      await loadTableFieldsAndRanges(currentTableId, true);
      await updatePreview();

      tableSelect.addEventListener('change', async () => {
        await loadTableFieldsAndRanges(tableSelect.value, false);
        await updatePreview();
      });
      rangeSelect.addEventListener('change', updatePreview);
      numSelect.addEventListener('change', updatePreview);
      denSelect.addEventListener('change', updatePreview);
      titleInput.addEventListener('input', () => {
        labelEl.textContent = titleInput.value.trim() || 'TỶ LỆ QUẢNG CÁO';
      });

      saveBtn.addEventListener('click', async () => {
        if (numSelect.value === denSelect.value) {
          alert('Cột Tử số và Cột Mẫu số không được trùng nhau! Vui lòng chọn 2 cột khác nhau.');
          return;
        }
        saveBtn.disabled = true;
        saveBtn.textContent = 'Đang lưu...';
        try {
          let rangeObj = { type: SourceType?.ALL || 'ALL' };
          try { rangeObj = JSON.parse(rangeSelect.value); } catch (_) {}

          const condition = createCondition(
            tableSelect.value,
            rangeObj,
            numSelect.value,
            denSelect.value,
            Rollup,
            SourceType
          );

          await dashboard.saveConfig({
            dataConditions: [condition],
            customConfig: {
              title: titleInput.value.trim() || 'TỶ LỆ QUẢNG CÁO'
            }
          });
        } catch (err) {
          alert('Lỗi khi lưu: ' + (err?.message || err));
          saveBtn.disabled = false;
          saveBtn.textContent = 'Xác nhận & Lưu cấu hình';
        }
      });
    }

    // ================= CHẾ ĐỘ HIỂN THỊ TRÊN DASHBOARD (VIEW / FULLSCREEN) =================
    async function initViewMode({ dashboard }) {
      let title = 'TỶ LỆ QUẢNG CÁO';

      async function renderFromDashboard(incomingData) {
        try {
          const cfg = await dashboard.getConfig();
          if (cfg?.customConfig?.title) {
            title = String(cfg.customConfig.title);
          }
        } catch (_) {}

        let data = incomingData;
        if (!Array.isArray(data) || data.length < 2) {
          data = await dashboard.getData();
        }

        const adsVal = data?.[1]?.[0]?.value ?? 0;
        const revVal = data?.[1]?.[1]?.value ?? 0;
        renderMetric(adsVal, revVal, title);
        await dashboard.setRendered();
      }

      await renderFromDashboard();

      // Lắng nghe sự kiện đổi Slicer Filter (SHOP, THỜI GIAN NGÀY, THỜI GIAN) theo thời gian thực
      dashboard.onDataChange(ev => renderFromDashboard(ev?.data));
      dashboard.onConfigChange(() => renderFromDashboard());
    }

    main();
  </script>
</body>
</html>
