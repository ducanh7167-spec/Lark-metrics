<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lark Dashboard Weighted Ratio Extension</title>
  <style>
    :root {
      --bg-card: #ffffff;
      --text-title: #646a73;
      --text-main: #1f2329;
      --text-sub: #8f959e;
      --border-color: #dee0e3;
      --primary: #3370ff;
      --primary-hover: #245bdb;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: var(--bg-card);
      color: var(--text-main);
      overflow: hidden;
    }
    #app {
      display: flex;
      width: 100%;
      height: 100%;
    }

    /* Khu vực hiển thị thẻ Metric */
    .preview-pane {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 14px 18px;
      min-width: 0;
      overflow: hidden;
      position: relative;
    }
    .metric-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-title);
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 6px;
      letter-spacing: 0.2px;
    }
    .metric-value {
      font-size: clamp(24px, 14vw, 36px);
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.15;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-variant-numeric: tabular-nums;
    }
    .metric-sub {
      margin-top: 6px;
      font-size: 11px;
      color: var(--text-sub);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .unconfigured-badge {
      display: none;
      margin-top: 6px;
      padding: 4px 8px;
      background: #fff7e6;
      border: 1px solid #ffd591;
      border-radius: 4px;
      color: #d46b08;
      font-size: 11px;
      line-height: 1.35;
    }
    .unconfigured-badge.visible {
      display: inline-block;
    }

    /* Khu vực cấu hình bên phải (chỉ hiện ở chế độ Create / Config) */
    .config-pane {
      width: 340px;
      border-left: 1px solid var(--border-color);
      padding: 14px 16px;
      display: none;
      flex-direction: column;
      gap: 11px;
      overflow-y: auto;
      background: #fafbfc;
    }
    #app.is-config .config-pane {
      display: flex;
    }
    .config-header {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-main);
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border-color);
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .form-group label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-title);
    }
    .form-hint {
      font-size: 11px;
      color: var(--text-sub);
      line-height: 1.35;
    }
    .form-control {
      width: 100%;
      padding: 7px 10px;
      font-size: 13px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      background: #fff;
      color: var(--text-main);
      outline: none;
      transition: border-color 0.15s;
    }
    .form-control:focus {
      border-color: var(--primary);
    }
    .row-2col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .checkbox-line {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text-main);
      cursor: pointer;
      user-select: none;
    }
    .btn-save {
      margin-top: auto;
      padding: 10px 14px;
      background: var(--primary);
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-save:hover {
      background: var(--primary-hover);
    }
    .btn-save:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .error-msg {
      color: #f54a45;
      font-size: 12px;
      margin-top: 4px;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- Màn hình hiển thị thẻ tỷ lệ -->
    <div class="preview-pane">
      <div class="metric-label" id="ui-title">TỶ LỆ QUẢNG CÁO</div>
      <div class="metric-value" id="ui-value">--%</div>
      <div class="metric-sub" id="ui-sub">Đang tải dữ liệu...</div>
      <div class="unconfigured-badge" id="ui-badge">
        ⚠️ Chưa liên kết Slicer: Bấm <b>"..."</b> góc phải khối ➔ <b>Cấu hình</b> ➔ <b>Lưu vào Dashboard</b>
      </div>
      <div class="error-msg" id="ui-error" style="display:none;"></div>
    </div>

    <!-- Bảng cấu hình bên phải -->
    <div class="config-pane">
      <div class="config-header">Cấu hình Tỷ lệ Trọng số (ΣA / ΣB)</div>

      <div class="form-group" id="grp-base" style="display:none;">
        <label for="sel-base">0. Nguồn Base (Bitable App)</label>
        <select id="sel-base" class="form-control"></select>
      </div>

      <div class="form-group">
        <label for="sel-table">1. Bảng dữ liệu nguồn</label>
        <select id="sel-table" class="form-control"></select>
      </div>

      <div class="form-group">
        <label for="sel-group">2. Trường phân nhóm (Liên kết Slicer)</label>
        <select id="sel-group" class="form-control"></select>
        <div class="form-hint">Chọn <b>TÊN SHOP</b> để Lark đồng bộ với mọi bộ lọc Slicer trên Dashboard.</div>
      </div>

      <div class="form-group">
        <label for="sel-num">3. Tử số — Tổng A (Chi phí Ads)</label>
        <select id="sel-num" class="form-control"></select>
      </div>

      <div class="form-group">
        <label for="sel-den">4. Mẫu số — Tổng B (Doanh thu thuần)</label>
        <select id="sel-den" class="form-control"></select>
      </div>

      <div class="form-group">
        <label for="inp-title">5. Tiêu đề thẻ</label>
        <input id="inp-title" type="text" class="form-control" value="TỶ LỆ QUẢNG CÁO" />
      </div>

      <div class="row-2col">
        <div class="form-group">
          <label for="sel-decimals">Số lẻ thập phân</label>
          <select id="sel-decimals" class="form-control">
            <option value="2" selected>2 chữ số (29,34%)</option>
            <option value="1">1 chữ số (29,3%)</option>
            <option value="0">Làm tròn (29%)</option>
          </select>
        </div>
        <div class="form-group">
          <label for="inp-color">Màu chữ chính</label>
          <input id="inp-color" type="color" class="form-control" value="#1f2329" style="height:34px;padding:3px 6px;" />
        </div>
      </div>

      <label class="checkbox-line">
        <input type="checkbox" id="chk-sub" checked />
        Hiển thị dòng phụ (Tổng Ads / Tổng Doanh thu)
      </label>

      <button id="btn-save" class="btn-save">Lưu vào Dashboard</button>
    </div>
  </div>

  <script type="module">
    let sdk;
    try {
      sdk = await import('https://cdn.jsdelivr.net/npm/@lark-base-open/js-sdk@1.0.2/+esm');
    } catch (e) {
      sdk = await import('https://esm.sh/@lark-base-open/js-sdk@1.0.2');
    }

    const {
      bitable: bitableSdk,
      bridge: bridgeSdk,
      workspace,
      DashboardState,
      Rollup,
      SourceType,
      GroupMode,
      ORDER,
      DATA_SOURCE_SORT_TYPE
    } = sdk;

    const appEl = document.getElementById('app');
    const uiTitle = document.getElementById('ui-title');
    const uiValue = document.getElementById('ui-value');
    const uiSub = document.getElementById('ui-sub');
    const uiBadge = document.getElementById('ui-badge');
    const uiError = document.getElementById('ui-error');

    const grpBase = document.getElementById('grp-base');
    const selBase = document.getElementById('sel-base');
    const selTable = document.getElementById('sel-table');
    const selGroup = document.getElementById('sel-group');
    const selNum = document.getElementById('sel-num');
    const selDen = document.getElementById('sel-den');
    const inpTitle = document.getElementById('inp-title');
    const selDecimals = document.getElementById('sel-decimals');
    const inpColor = document.getElementById('inp-color');
    const chkSub = document.getElementById('chk-sub');
    const btnSave = document.getElementById('btn-save');

    let isMultipleBase = false;
    let activeBitable = bitableSdk;
    let activeDashboard = bitableSdk.dashboard;
    let activeBase = bitableSdk.base;
    let activeDataRange = { type: (SourceType && SourceType.ALL) ? SourceType.ALL : 'ALL' };

    let currentConfig = {
      baseToken: '',
      tableId: '',
      groupFieldId: '',
      numFieldId: '',
      denFieldId: '',
      title: 'TỶ LỆ QUẢNG CÁO',
      decimals: 2,
      color: '#1f2329',
      showSub: true
    };

    function showError(msg) {
      if (!msg) {
        uiError.style.display = 'none';
        uiError.textContent = '';
      } else {
        uiError.style.display = 'block';
        uiError.textContent = msg;
      }
    }

    function toNumber(val) {
      if (typeof val === 'number') return Number.isFinite(val) ? val : 0;
      if (val === null || val === undefined || val === '') return 0;
      if (typeof val === 'object') {
        if ('value' in val) return toNumber(val.value);
        if (Array.isArray(val)) return val.reduce((s, x) => s + toNumber(x), 0);
      }
      const n = Number(val);
      if (Number.isFinite(n)) return n;
      const cleaned = String(val).replace(/[^0-9.-]+/g, '');
      const parsed = parseFloat(cleaned);
      return Number.isFinite(parsed) ? parsed : 0;
    }

    function getFieldTypeLabel(type) {
      switch (type) {
        case 2: return 'Số';
        case 99003: return 'Tiền tệ';
        case 20: return 'Công thức';
        case 19: return 'Tra cứu';
        case 1: return 'Văn bản';
        case 3: return 'Chọn một';
        case 4: return 'Chọn nhiều';
        case 5: return 'Ngày';
        default: return '';
      }
    }

    /**
     * Khởi tạo ngữ cảnh Bitable App (workspace.getBitable) theo đúng baseToken
     */
    async function switchBaseContext(baseToken) {
      if (baseToken && workspace && typeof workspace.getBitable === 'function') {
        try {
          const scoped = await workspace.getBitable(baseToken);
          if (scoped) {
            activeBitable = scoped;
            activeDashboard = scoped.dashboard || bitableSdk.dashboard;
            activeBase = scoped.base || bitableSdk.base;
            return;
          }
        } catch (e) {
          console.warn('workspace.getBitable fallback:', e);
        }
      }
      activeBitable = bitableSdk;
      activeDashboard = bitableSdk.dashboard;
      activeBase = bitableSdk.base;
    }

    /**
     * Xây dựng IDataCondition có đầy đủ baseToken + tableId + dataRange + groups + series
     */
    function buildCondition(cfg) {
      const isSameField = cfg.numFieldId === cfg.denFieldId;
      const sumRollup = (Rollup && Rollup.SUM) ? Rollup.SUM : 'SUM';
      const series = isSameField
        ? [{ fieldId: cfg.numFieldId, rollup: sumRollup }]
        : [
            { fieldId: cfg.numFieldId, rollup: sumRollup },
            { fieldId: cfg.denFieldId, rollup: sumRollup }
          ];

      const condition = {
        tableId: cfg.tableId,
        dataRange: activeDataRange || { type: (SourceType && SourceType.ALL) ? SourceType.ALL : 'ALL' },
        series
      };

      if (cfg.baseToken) {
        condition.baseToken = cfg.baseToken;
      }

      if (cfg.groupFieldId) {
        condition.groups = [
          {
            fieldId: cfg.groupFieldId,
            mode: (GroupMode && GroupMode.ENUMERATED) ? GroupMode.ENUMERATED : 'enumerated',
            sort: {
              order: (ORDER && ORDER.ASCENDING) ? ORDER.ASCENDING : 1,
              sortType: (DATA_SOURCE_SORT_TYPE && DATA_SOURCE_SORT_TYPE.VALUE) ? DATA_SOURCE_SORT_TYPE.VALUE : 'VALUE'
            }
          }
        ];
      }

      return condition;
    }

    function extractTotals(data, cfg) {
      if (!Array.isArray(data) || data.length < 2) {
        return { num: 0, den: 0 };
      }

      const isSameField = cfg && cfg.numFieldId && cfg.numFieldId === cfg.denFieldId;
      const hasGroup = Boolean(cfg && cfg.groupFieldId);

      let totalNum = 0;
      let totalDen = 0;

      for (let r = 1; r < data.length; r++) {
        const row = data[r];
        if (!Array.isArray(row) || row.length === 0) continue;

        if (hasGroup && row.length >= 2) {
          const numVal = toNumber(row[1]?.value);
          const denVal = isSameField ? numVal : toNumber(row[2]?.value);
          totalNum += numVal;
          totalDen += denVal;
        } else {
          const numVal = toNumber(row[0]?.value);
          const denVal = (isSameField || row.length < 2) ? numVal : toNumber(row[1]?.value);
          totalNum += numVal;
          totalDen += denVal;
        }
      }

      return { num: totalNum, den: totalDen };
    }

    function renderMetric(num, den, cfg) {
      showError('');
      const title = (cfg && cfg.title) ? cfg.title : 'TỶ LỆ QUẢNG CÁO';
      const decimals = Number.isFinite(Number(cfg?.decimals)) ? Number(cfg.decimals) : 2;
      const color = cfg?.color || '#1f2329';
      const showSub = cfg?.showSub !== undefined ? Boolean(cfg.showSub) : true;

      uiTitle.textContent = title;
      uiValue.style.color = color;

      const ratio = den !== 0 ? (num / den) * 100 : 0;
      uiValue.textContent = ratio.toLocaleString('vi-VN', {
        minimumFractionDigits: decimals,
        maximumFractionDigits: decimals
      }) + '%';

      if (showSub) {
        uiSub.style.display = 'block';
        const fmtNum = Math.round(num).toLocaleString('vi-VN');
        const fmtDen = Math.round(den).toLocaleString('vi-VN');
        uiSub.textContent = `Ads: ${fmtNum} / DT: ${fmtDen}`;
      } else {
        uiSub.style.display = 'none';
      }

      if (activeDashboard && typeof activeDashboard.setRendered === 'function') {
        activeDashboard.setRendered();
      } else if (bitableSdk.dashboard && typeof bitableSdk.dashboard.setRendered === 'function') {
        bitableSdk.dashboard.setRendered();
      }
    }

    /**
     * Tải danh sách Base khi chạy trong Bitable App (TAV - MASTER ONE)
     */
    async function loadBasesIfNeeded() {
      try {
        const env = await (bridgeSdk || bitableSdk.bridge).getEnv();
        isMultipleBase = Boolean(env && env.needChangeBase);
      } catch (e) {
        isMultipleBase = false;
      }

      let baseList = [];
      if (workspace && typeof workspace.getBaseList === 'function') {
        try {
          const res = await workspace.getBaseList({ query: '', page: { cursor: '' } });
          if (res && Array.isArray(res.base_list) && res.base_list.length > 0) {
            baseList = res.base_list;
            isMultipleBase = true;
          }
        } catch (e) {
          // Không phải môi trường multi-base workspace
        }
      }

      if (isMultipleBase && baseList.length > 0) {
        grpBase.style.display = 'flex';
        selBase.innerHTML = '';
        let preferredToken = '';

        for (const b of baseList) {
          const opt = document.createElement('option');
          opt.value = b.token;
          opt.textContent = b.name;
          selBase.appendChild(opt);
          if (/tav|master\s*one/i.test(b.name)) {
            preferredToken = b.token;
          }
        }

        const validTokens = new Set(baseList.map(b => b.token));
        if (!currentConfig.baseToken || !validTokens.has(currentConfig.baseToken)) {
          currentConfig.baseToken = preferredToken || baseList[0].token;
        }
        selBase.value = currentConfig.baseToken;
        await switchBaseContext(currentConfig.baseToken);
      } else {
        grpBase.style.display = 'none';
        if (currentConfig.baseToken) {
          await switchBaseContext(currentConfig.baseToken);
        }
      }
    }

    async function loadTables() {
      const tableList = await activeBase.getTableList();
      selTable.innerHTML = '';
      let preferredId = '';

      for (const t of tableList) {
        const name = await t.getName();
        const opt = document.createElement('option');
        opt.value = t.id;
        opt.textContent = name;
        selTable.appendChild(opt);
        if (/tracking\s*all/i.test(name)) {
          preferredId = t.id;
        }
      }

      const validTableIds = new Set(tableList.map(t => t.id));
      if (!currentConfig.tableId || !validTableIds.has(currentConfig.tableId)) {
        currentConfig.tableId = preferredId || (tableList[0] ? tableList[0].id : '');
      }
      selTable.value = currentConfig.tableId;
    }

    async function loadFields(tableId) {
      if (!tableId) return;

      // 1. Lấy dataRange chuẩn từ getTableDataRange
      try {
        const ranges = await activeDashboard.getTableDataRange(tableId);
        if (Array.isArray(ranges) && ranges.length > 0) {
          const allRange = ranges.find(r => r.type === SourceType.ALL || r.type === 'ALL') || ranges[0];
          const cleanRange = { ...allRange };
          delete cleanRange.filterInfo;
          activeDataRange = cleanRange;
        }
      } catch (e) {
        activeDataRange = { type: (SourceType && SourceType.ALL) ? SourceType.ALL : 'ALL' };
      }

      // 2. Lấy danh sách trường hợp lệ của Dashboard từ getCategories + getFieldMetaList
      let items = [];
      try {
        const cats = await activeDashboard.getCategories(tableId);
        if (Array.isArray(cats) && cats.length > 0) {
          items = cats.map(c => ({
            id: c.fieldId,
            name: c.fieldName,
            type: c.fieldType
          }));
        }
      } catch (e) {
        console.warn('getCategories fallback:', e);
      }

      if (items.length === 0) {
        const table = await activeBase.getTableById(tableId);
        const fieldMetaList = await table.getFieldMetaList();
        items = fieldMetaList.map(f => ({
          id: f.id,
          name: f.name,
          type: f.type
        }));
      }

      selGroup.innerHTML = '';
      selNum.innerHTML = '';
      selDen.innerHTML = '';

      let autoGroupId = '';
      let autoNumId = '';
      let autoDenId = '';

      for (const f of items) {
        const badge = getFieldTypeLabel(f.type);
        const label = badge ? `${f.name} [${badge}]` : f.name;

        const optG = document.createElement('option');
        optG.value = f.id;
        optG.textContent = label;
        selGroup.appendChild(optG);

        const optN = document.createElement('option');
        optN.value = f.id;
        optN.textContent = label;
        selNum.appendChild(optN);

        const optD = document.createElement('option');
        optD.value = f.id;
        optD.textContent = label;
        selDen.appendChild(optD);

        const norm = f.name.trim().toLowerCase();

        if (!autoGroupId && (norm.includes('tên shop') || norm === 'shop')) {
          autoGroupId = f.id;
        }

        if (!autoNumId && (norm.includes('chi phí ads') || norm.includes('chi phi ads'))) {
          autoNumId = f.id;
        }

        if (!autoDenId && (norm.includes('doanh thu thuần') || norm.includes('doanh thu thuan'))) {
          autoDenId = f.id;
        }
      }

      const validIds = new Set(items.map(f => f.id));

      if (!currentConfig.groupFieldId || !validIds.has(currentConfig.groupFieldId)) {
        currentConfig.groupFieldId = autoGroupId || (items[0]?.id ?? '');
      }
      if (!currentConfig.numFieldId || !validIds.has(currentConfig.numFieldId)) {
        currentConfig.numFieldId = autoNumId || (items[0]?.id ?? '');
      }
      if (!currentConfig.denFieldId || !validIds.has(currentConfig.denFieldId)) {
        currentConfig.denFieldId = autoDenId || (items[Math.min(1, items.length - 1)]?.id ?? '');
      }

      selGroup.value = currentConfig.groupFieldId;
      selNum.value = currentConfig.numFieldId;
      selDen.value = currentConfig.denFieldId;
    }

    async function autoDetectConfigIfNeeded() {
      await loadBasesIfNeeded();
      const tableList = await activeBase.getTableList();
      let targetTable = tableList[0];
      for (const t of tableList) {
        const name = await t.getName();
        if (/tracking\s*all/i.test(name)) {
          targetTable = t;
          break;
        }
      }
      if (!targetTable) return;

      currentConfig.tableId = targetTable.id;
      const fields = await targetTable.getFieldMetaList();

      let gId = fields[0]?.id || '';
      let nId = fields[0]?.id || '';
      let dId = fields[1]?.id || fields[0]?.id || '';

      for (const f of fields) {
        const norm = f.name.trim().toLowerCase();
        if (norm.includes('tên shop') || norm === 'shop') gId = f.id;
        if (norm.includes('chi phí ads') || norm.includes('chi phi ads')) nId = f.id;
        if (norm.includes('doanh thu thuần') || norm.includes('doanh thu thuan')) dId = f.id;
      }

      currentConfig.groupFieldId = gId;
      currentConfig.numFieldId = nId;
      currentConfig.denFieldId = dId;
    }

    async function updatePreview() {
      try {
        if (isMultipleBase && selBase.value) {
          currentConfig.baseToken = selBase.value;
        }
        currentConfig.tableId = selTable.value;
        currentConfig.groupFieldId = selGroup.value;
        currentConfig.numFieldId = selNum.value;
        currentConfig.denFieldId = selDen.value;
        currentConfig.title = inpTitle.value.trim() || 'TỶ LỆ QUẢNG CÁO';
        currentConfig.decimals = parseInt(selDecimals.value, 10) || 2;
        currentConfig.color = inpColor.value || '#1f2329';
        currentConfig.showSub = chkSub.checked;

        if (!currentConfig.tableId || !currentConfig.numFieldId || !currentConfig.denFieldId) return;

        const condition = buildCondition(currentConfig);
        const data = await activeDashboard.getPreviewData(condition);
        const { num, den } = extractTotals(data, currentConfig);
        renderMetric(num, den, currentConfig);
      } catch (err) {
        console.error('updatePreview error:', err);
        showError('Lỗi xem trước: ' + (err.message || String(err)));
      }
    }

    async function fetchAndRenderViewData() {
      try {
        const data = await activeDashboard.getData();
        uiBadge.classList.remove('visible');
        const { num, den } = extractTotals(data, currentConfig);
        renderMetric(num, den, currentConfig);
      } catch (err) {
        console.warn('getData() fallback sang getPreviewData:', err);
        try {
          if (!currentConfig.tableId || !currentConfig.numFieldId || !currentConfig.denFieldId) {
            await autoDetectConfigIfNeeded();
          }
          const condition = buildCondition(currentConfig);
          const previewData = await activeDashboard.getPreviewData(condition);
          uiBadge.classList.add('visible');
          const { num, den } = extractTotals(previewData, currentConfig);
          renderMetric(num, den, currentConfig);
        } catch (fallbackErr) {
          showError('Vui lòng bấm "..." góc phải khối -> Cấu hình -> Lưu vào Dashboard.');
        }
      }
    }

    function applySavedConfigObject(saved) {
      if (!saved) return;
      if (saved.customConfig) {
        currentConfig = { ...currentConfig, ...saved.customConfig };
      }
      const dc = Array.isArray(saved.dataConditions) ? saved.dataConditions[0] : saved.dataConditions;
      if (dc) {
        if (dc.baseToken) currentConfig.baseToken = dc.baseToken;
        if (dc.tableId) currentConfig.tableId = dc.tableId;
        if (dc.dataRange) {
          const cleanRange = { ...dc.dataRange };
          delete cleanRange.filterInfo;
          activeDataRange = cleanRange;
        }
        if (dc.groups?.[0]?.fieldId) currentConfig.groupFieldId = dc.groups[0].fieldId;
        if (dc.series?.[0]?.fieldId) currentConfig.numFieldId = dc.series[0].fieldId;
        if (dc.series?.[1]?.fieldId) currentConfig.denFieldId = dc.series[1].fieldId;
      }
    }

    async function init() {
      try {
        const state = bitableSdk.dashboard.state;
        const isCreate = state === DashboardState.Create || state === 'Create';
        const isConfig = state === DashboardState.Config || state === 'Config';

        if (!isCreate) {
          try {
            const saved = await bitableSdk.dashboard.getConfig();
            applySavedConfigObject(saved);
          } catch (e) {
            console.warn('Chưa có config đã lưu:', e);
          }
        }

        if (isCreate || isConfig) {
          appEl.classList.add('is-config');
          uiBadge.classList.remove('visible');

          inpTitle.value = currentConfig.title || 'TỶ LỆ QUẢNG CÁO';
          selDecimals.value = String(currentConfig.decimals ?? 2);
          inpColor.value = currentConfig.color || '#1f2329';
          chkSub.checked = currentConfig.showSub !== false;

          await loadBasesIfNeeded();
          await loadTables();
          await loadFields(currentConfig.tableId);
          await updatePreview();

          selBase.addEventListener('change', async () => {
            currentConfig.baseToken = selBase.value;
            currentConfig.tableId = '';
            currentConfig.groupFieldId = '';
            currentConfig.numFieldId = '';
            currentConfig.denFieldId = '';
            await switchBaseContext(currentConfig.baseToken);
            await loadTables();
            await loadFields(currentConfig.tableId);
            await updatePreview();
          });

          selTable.addEventListener('change', async () => {
            currentConfig.tableId = selTable.value;
            currentConfig.groupFieldId = '';
            currentConfig.numFieldId = '';
            currentConfig.denFieldId = '';
            await loadFields(currentConfig.tableId);
            await updatePreview();
          });

          selGroup.addEventListener('change', updatePreview);
          selNum.addEventListener('change', updatePreview);
          selDen.addEventListener('change', updatePreview);
          inpTitle.addEventListener('input', updatePreview);
          selDecimals.addEventListener('change', updatePreview);
          inpColor.addEventListener('input', updatePreview);
          chkSub.addEventListener('change', updatePreview);

          btnSave.addEventListener('click', async () => {
            btnSave.disabled = true;
            btnSave.textContent = 'Đang lưu...';
            try {
              const condition = buildCondition(currentConfig);
              await activeDashboard.saveConfig({
                customConfig: { ...currentConfig },
                dataConditions: [condition]
              });
            } catch (err) {
              console.error('saveConfig error:', err);
              showError('Lỗi khi lưu: ' + (err.message || String(err)));
              btnSave.disabled = false;
              btnSave.textContent = 'Lưu vào Dashboard';
            }
          });
        } else {
          appEl.classList.remove('is-config');
          if (currentConfig.baseToken) {
            await switchBaseContext(currentConfig.baseToken);
          } else {
            await loadBasesIfNeeded();
          }
          await fetchAndRenderViewData();
        }

        // Lắng nghe sự kiện Slicer thay đổi trên cả activeDashboard và global dashboard
        const handleDataChange = async (res) => {
          const data = res?.data ?? res;
          if (Array.isArray(data) && data.length >= 2) {
            uiBadge.classList.remove('visible');
            const { num, den } = extractTotals(data, currentConfig);
            renderMetric(num, den, currentConfig);
          } else {
            await fetchAndRenderViewData();
          }
        };

        activeDashboard.onDataChange(handleDataChange);
        if (activeDashboard !== bitableSdk.dashboard) {
          bitableSdk.dashboard.onDataChange(handleDataChange);
        }

        const handleConfigChange = async (res) => {
          const cfg = res?.data ?? res;
          applySavedConfigObject(cfg);
          if (currentConfig.baseToken) {
            await switchBaseContext(currentConfig.baseToken);
          }
          await fetchAndRenderViewData();
        };

        activeDashboard.onConfigChange(handleConfigChange);
        if (activeDashboard !== bitableSdk.dashboard) {
          bitableSdk.dashboard.onConfigChange(handleConfigChange);
        }
      } catch (err) {
        console.error('Init error:', err);
        showError('Lỗi khởi tạo: ' + (err.message || String(err)));
      }
    }

    init();
  </script>
</body>
</html>
