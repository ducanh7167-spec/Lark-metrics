<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lark Base Weighted Ratio Metric</title>
  <style>
    :root {
      --text-main: #1f2329;
      --text-sub: #646a73;
      --text-muted: #8f959e;
      --border-color: #dee0e3;
      --primary: #3370ff;
      --panel-bg: #ffffff;
      --badge-ok-bg: #e8ffea;
      --badge-ok-text: #00b42a;
      --badge-warn-bg: #fff7e8;
      --badge-warn-text: #ff7d00;
      /* Cỡ chữ (được ghi đè từ cấu hình) */
      --title-size: 13px;
      --value-size: clamp(24px, 16vw, 38px);
      --sub-size: 11px;
      --value-color: var(--text-main);
      --align: flex-start;
      --text-align: left;
    }
    body[theme-mode="dark"] {
      --text-main: #f5f6f7;
      --text-sub: #a6aeb8;
      --text-muted: #757c85;
      --border-color: #373c43;
      --panel-bg: #1f2023;
      --badge-ok-bg: #12361b;
      --badge-ok-text: #27c346;
      --badge-warn-bg: #3d2809;
      --badge-warn-text: #ff9a2e;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, Helvetica Neue, Tahoma, PingFang SC, Microsoft Yahei, Arial, sans-serif;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: transparent !important;
      background-image: none !important;
      color: var(--text-main);
      overflow: hidden;
    }
    #app {
      display: flex;
      width: 100%;
      height: 100%;
    }

    /* Khu vực hiển thị thẻ Metric */
    .metric-view {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: var(--align);
      text-align: var(--text-align);
      padding: 12px 16px;
      height: 100%;
      overflow: hidden;
    }
    .metric-title {
      max-width: 100%;
      font-size: var(--title-size);
      font-weight: 600;
      color: var(--text-sub);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .metric-value {
      max-width: 100%;
      font-size: var(--value-size);
      font-weight: 700;
      line-height: 1.15;
      color: var(--value-color);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .metric-sub {
      max-width: 100%;
      margin-top: 6px;
      font-size: var(--sub-size);
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .status-msg {
      margin-top: 4px;
      font-size: 11px;
      color: #f54a45;
      line-height: 1.3;
      display: none;
    }

    /* Panel cấu hình (chỉ hiện khi Create / Config) */
    .config-panel {
      width: 340px;
      height: 100%;
      border-left: 1px solid var(--border-color);
      background: var(--panel-bg);
      padding: 14px 16px;
      overflow-y: auto;
      display: none;
      flex-direction: column;
      gap: 11px;
    }
    body.is-config .config-panel {
      display: flex;
    }
    .config-title {
      font-size: 14px;
      font-weight: 700;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .section-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-main);
      padding-top: 6px;
      border-top: 1px dashed var(--border-color);
    }
    .token-badge {
      font-size: 10px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 4px;
      background: var(--badge-ok-bg);
      color: var(--badge-ok-text);
    }
    .token-badge.warn {
      background: var(--badge-warn-bg);
      color: var(--badge-warn-text);
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }
    .form-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-sub);
    }
    .form-hint {
      font-size: 11px;
      color: var(--text-muted);
      line-height: 1.35;
    }
    .form-control {
      width: 100%;
      height: 32px;
      padding: 0 8px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      background: var(--panel-bg);
      color: var(--text-main);
      font-size: 12px;
      outline: none;
    }
    .form-control:focus {
      border-color: var(--primary);
    }
    .row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .row-3 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
    }
    .color-input {
      padding: 2px;
      cursor: pointer;
    }
    .btn-save {
      margin-top: auto;
      width: 100%;
      min-height: 36px;
      border: none;
      border-radius: 6px;
      background: var(--primary);
      color: #ffffff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-save:hover {
      opacity: 0.92;
    }
    .btn-save:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="metric-view">
      <div class="metric-title" id="uiTitle">TỶ LỆ QUẢNG CÁO</div>
      <div class="metric-value" id="uiValue">--%</div>
      <div class="metric-sub" id="uiSub">Đang tải dữ liệu...</div>
      <div class="status-msg" id="uiError"></div>
    </div>

    <div class="config-panel">
      <div class="config-title">
        <span>Cấu hình Tỷ lệ (∑A / ∑B)</span>
        <span class="token-badge" id="tokenBadge">Đang lấy BaseToken...</span>
      </div>

      <div class="form-group">
        <label class="form-label">0. Đa bảng (Base nguồn)</label>
        <select id="baseSelect" class="form-control"></select>
      </div>

      <div class="form-group">
        <label class="form-label">1. Bảng dữ liệu nguồn (Table)</label>
        <select id="tableSelect" class="form-control"></select>
      </div>

      <div class="form-group">
        <label class="form-label">2. Phạm vi dữ liệu (View)</label>
        <select id="rangeSelect" class="form-control"></select>
        <div class="form-hint">Mẹo: tạo sẵn View "30 ngày qua" trong bảng TRACKING ALL rồi chọn ở đây để thẻ mặc định lọc 30 ngày.</div>
      </div>

      <div class="form-group">
        <label class="form-label">3. Trường phân nhóm</label>
        <select id="groupFieldSelect" class="form-control"></select>
      </div>

      <div class="form-group">
        <label class="form-label">4. Tử số — Tổng A (VD: CHI PHÍ ADS)</label>
        <select id="numFieldSelect" class="form-control"></select>
      </div>

      <div class="form-group">
        <label class="form-label">5. Mẫu số — Tổng B (VD: DOANH THU THUẦN)</label>
        <select id="denFieldSelect" class="form-control"></select>
      </div>

      <div class="section-title">Hiển thị</div>

      <div class="row-2">
        <div class="form-group">
          <label class="form-label">Tiêu đề thẻ</label>
          <input type="text" id="titleInput" class="form-control" value="TỶ LỆ QUẢNG CÁO" />
        </div>
        <div class="form-group">
          <label class="form-label">Số lẻ thập phân</label>
          <select id="precisionSelect" class="form-control">
            <option value="2" selected>2 (29,34%)</option>
            <option value="1">1 (29,3%)</option>
            <option value="0">0 (29%)</option>
          </select>
        </div>
      </div>

      <div class="row-3">
        <div class="form-group">
          <label class="form-label">Cỡ tiêu đề</label>
          <input type="number" id="titleSizeInput" class="form-control" min="8" max="60" step="1" value="13" />
        </div>
        <div class="form-group">
          <label class="form-label">Cỡ số chính</label>
          <input type="number" id="valueSizeInput" class="form-control" min="0" max="200" step="1" value="0" />
        </div>
        <div class="form-group">
          <label class="form-label">Cỡ dòng phụ</label>
          <input type="number" id="subSizeInput" class="form-control" min="8" max="40" step="1" value="11" />
        </div>
      </div>
      <div class="form-hint">Đơn vị px. Cỡ số chính = 0 nghĩa là tự co giãn theo kích thước khối.</div>

      <div class="row-2">
        <div class="form-group">
          <label class="form-label">Căn lề</label>
          <select id="alignSelect" class="form-control">
            <option value="left" selected>Trái</option>
            <option value="center">Giữa</option>
            <option value="right">Phải</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Màu số chính</label>
          <input type="color" id="valueColorInput" class="form-control color-input" value="#1f2329" />
        </div>
      </div>

      <label style="font-size:12px; display:flex; align-items:center; gap:6px; cursor:pointer;">
        <input type="checkbox" id="showSubCheck" checked />
        Hiển thị dòng phụ (Ads / DT)
      </label>

      <button id="saveBtn" class="btn-save">Lưu vào Dashboard</button>
    </div>
  </div>

  <script type="module">
    async function loadSDK() {
      const urls = [
        'https://cdn.jsdelivr.net/npm/@lark-base-open/js-sdk@1.0.2/+esm',
        'https://esm.sh/@lark-base-open/js-sdk@1.0.2',
        'https://esm.sh/@lark-base-open/js-sdk@0.5.0'
      ];
      for (const u of urls) {
        try {
          return await import(u);
        } catch (e) {
          console.warn('Thử CDN tiếp theo:', u, e);
        }
      }
      throw new Error('Không thể tải @lark-base-open/js-sdk');
    }

    const rootStyle = document.documentElement.style;
    const uiTitle = document.getElementById('uiTitle');
    const uiValue = document.getElementById('uiValue');
    const uiSub = document.getElementById('uiSub');
    const uiError = document.getElementById('uiError');
    const tokenBadge = document.getElementById('tokenBadge');

    const baseSelect = document.getElementById('baseSelect');
    const tableSelect = document.getElementById('tableSelect');
    const rangeSelect = document.getElementById('rangeSelect');
    const groupFieldSelect = document.getElementById('groupFieldSelect');
    const numFieldSelect = document.getElementById('numFieldSelect');
    const denFieldSelect = document.getElementById('denFieldSelect');
    const titleInput = document.getElementById('titleInput');
    const precisionSelect = document.getElementById('precisionSelect');
    const titleSizeInput = document.getElementById('titleSizeInput');
    const valueSizeInput = document.getElementById('valueSizeInput');
    const subSizeInput = document.getElementById('subSizeInput');
    const alignSelect = document.getElementById('alignSelect');
    const valueColorInput = document.getElementById('valueColorInput');
    const showSubCheck = document.getElementById('showSubCheck');
    const saveBtn = document.getElementById('saveBtn');

    function setError(msg) {
      uiError.style.display = msg ? 'block' : 'none';
      uiError.textContent = msg || '';
    }

    function parseNum(v) {
      if (v === null || v === undefined || v === '' || v === '#DIV/0!') return 0;
      if (typeof v === 'number') return isFinite(v) ? v : 0;
      if (typeof v === 'object') {
        if ('value' in v) return parseNum(v.value);
        if ('text' in v) return parseNum(v.text);
        return 0;
      }
      const s = String(v).trim().replace(/[^\d.,-]/g, '');
      if (!s) return 0;
      if (/^-?\d+(\.\d{3})+$/.test(s)) return Number(s.replace(/\./g, '')) || 0;
      if (/^-?\d+(,\d{3})+$/.test(s)) return Number(s.replace(/,/g, '')) || 0;
      const n = Number(s.replace(/,/g, ''));
      return isFinite(n) ? n : 0;
    }

    function formatVN(n, decimals = 2) {
      return Number(n || 0).toLocaleString('vi-VN', {
        minimumFractionDigits: decimals,
        maximumFractionDigits: decimals
      });
    }

    function clampInt(v, min, max, fallback) {
      const n = Math.round(Number(v));
      if (!isFinite(n)) return fallback;
      return Math.min(max, Math.max(min, n));
    }

    function sumFromIData(matrix) {
      let sumNum = 0;
      let sumDen = 0;
      if (!Array.isArray(matrix) || matrix.length < 2) {
        return { sumNum: 0, sumDen: 0 };
      }
      for (let r = 1; r < matrix.length; r++) {
        const row = matrix[r];
        if (!Array.isArray(row) || row.length < 2) continue;
        if (row.length >= 3) {
          sumNum += parseNum(row[1]);
          sumDen += parseNum(row[2]);
        } else {
          sumNum += parseNum(row[0]);
          sumDen += parseNum(row[1]);
        }
      }
      return { sumNum, sumDen };
    }

    async function init() {
      try {
        const sdk = await loadSDK();
        const bitableSdk = sdk.bitable;
        const dashboardSdk = sdk.dashboard || bitableSdk?.dashboard;
        const workspace = sdk.workspace || bitableSdk?.workspace;

        const DashboardState = sdk.DashboardState || {
          Create: 'Create',
          Config: 'Config',
          View: 'View',
          FullScreen: 'FullScreen'
        };
        const SourceType = sdk.SourceType || { ALL: 'ALL', VIEW: 'VIEW' };
        const Rollup = sdk.Rollup || { SUM: 'SUM' };
        const GroupMode = sdk.GroupMode || { INTEGRATED: 'integrated' };
        const ORDER = sdk.ORDER || { ASCENDING: 1 };
        const DATA_SOURCE_SORT_TYPE = sdk.DATA_SOURCE_SORT_TYPE || { VALUE: 'VALUE' };

        let activeBitable = bitableSdk;
        let activeDashboard = dashboardSdk;
        let availableBases = [];
        let availableRanges = [{ type: SourceType.ALL }];

        if (workspace && typeof workspace.getBaseList === 'function') {
          try {
            const res = await workspace.getBaseList({ query: '', page: { cursor: '' } });
            availableBases = res?.base_list || res?.baseList || [];
          } catch (e) {
            console.warn('getBaseList warning:', e);
          }
        }

        const state = dashboardSdk.state;
        const isCreate = state === DashboardState.Create;
        const isConfigMode = isCreate || state === DashboardState.Config;
        document.body.classList.toggle('is-config', isConfigMode);

        let currentConfig = {
          baseToken: '',
          tableId: '',
          dataRange: { type: SourceType.ALL },
          groupFieldId: '',
          numFieldId: '',
          denFieldId: '',
          title: 'TỶ LỆ QUẢNG CÁO',
          precision: 2,
          showSub: true,
          titleSize: 13,
          valueSize: 0,
          subSize: 11,
          align: 'left',
          valueColor: ''
        };

        function parseSavedConfig(saved) {
          if (!saved) return;
          const conds = Array.isArray(saved.dataConditions) ? saved.dataConditions : [saved.dataConditions];
          const cond0 = conds[0] || {};
          const custom = saved.customConfig || {};

          if (cond0.baseToken || custom.baseToken) currentConfig.baseToken = cond0.baseToken || custom.baseToken;
          if (cond0.tableId || custom.tableId) currentConfig.tableId = cond0.tableId || custom.tableId;
          if (cond0.dataRange) currentConfig.dataRange = cond0.dataRange;
          if (cond0.groups?.[0]?.fieldId || custom.groupFieldId) currentConfig.groupFieldId = cond0.groups?.[0]?.fieldId || custom.groupFieldId;
          if (cond0.series?.[0]?.fieldId || custom.numFieldId) currentConfig.numFieldId = cond0.series?.[0]?.fieldId || custom.numFieldId;
          if (cond0.series?.[1]?.fieldId || custom.denFieldId) currentConfig.denFieldId = cond0.series?.[1]?.fieldId || custom.denFieldId;

          if (custom.title !== undefined) currentConfig.title = custom.title;
          if (custom.precision !== undefined) currentConfig.precision = Number(custom.precision);
          if (custom.showSub !== undefined) currentConfig.showSub = Boolean(custom.showSub);
          if (custom.titleSize !== undefined) currentConfig.titleSize = Number(custom.titleSize);
          if (custom.valueSize !== undefined) currentConfig.valueSize = Number(custom.valueSize);
          if (custom.subSize !== undefined) currentConfig.subSize = Number(custom.subSize);
          if (custom.align !== undefined) currentConfig.align = custom.align;
          if (custom.valueColor !== undefined) currentConfig.valueColor = custom.valueColor;
        }

        // Áp dụng cỡ chữ / căn lề / màu từ cấu hình
        function applyStyles() {
          const titleSize = clampInt(currentConfig.titleSize, 8, 60, 13);
          const valueSize = clampInt(currentConfig.valueSize, 0, 200, 0);
          const subSize = clampInt(currentConfig.subSize, 8, 40, 11);

          rootStyle.setProperty('--title-size', titleSize + 'px');
          rootStyle.setProperty('--value-size', valueSize > 0 ? valueSize + 'px' : 'clamp(24px, 16vw, 38px)');
          rootStyle.setProperty('--sub-size', subSize + 'px');

          const alignMap = {
            left: ['flex-start', 'left'],
            center: ['center', 'center'],
            right: ['flex-end', 'right']
          };
          const [flexAlign, textAlign] = alignMap[currentConfig.align] || alignMap.left;
          rootStyle.setProperty('--align', flexAlign);
          rootStyle.setProperty('--text-align', textAlign);

          if (currentConfig.valueColor) {
            rootStyle.setProperty('--value-color', currentConfig.valueColor);
          } else {
            rootStyle.removeProperty('--value-color');
          }
        }

        try {
          const saved = await dashboardSdk.getConfig();
          parseSavedConfig(saved);
        } catch (e) {
          // Trạng thái Create chưa có config
        }
        applyStyles();

        if (!currentConfig.baseToken && availableBases.length > 0) {
          currentConfig.baseToken = availableBases[0].token;
        }

        async function switchBitableInstance(token) {
          if (token && workspace && typeof workspace.getBitable === 'function') {
            try {
              const app = await workspace.getBitable(token);
              if (app) {
                activeBitable = app;
                activeDashboard = app.dashboard || dashboardSdk;
                tokenBadge.textContent = 'BaseToken: OK';
                tokenBadge.classList.remove('warn');
                return;
              }
            } catch (e) {
              console.warn('getBitable error:', e);
            }
          }
          activeBitable = bitableSdk;
          activeDashboard = dashboardSdk;
          tokenBadge.textContent = 'Base mặc định';
          tokenBadge.classList.add('warn');
        }

        await switchBitableInstance(currentConfig.baseToken);

        async function syncTheme() {
          try {
            const res = await activeDashboard.getTheme();
            const isDark = String(res?.theme || '').toUpperCase().includes('DARK');
            document.body.setAttribute('theme-mode', isDark ? 'dark' : 'light');
          } catch (e) {}
        }
        await syncTheme();
        if (activeDashboard.onThemeChange) {
          activeDashboard.onThemeChange(() => syncTheme());
        }

        function buildDataCondition() {
          const cond = {
            tableId: currentConfig.tableId,
            dataRange: currentConfig.dataRange || { type: SourceType.ALL },
            series: [
              { fieldId: currentConfig.numFieldId, rollup: Rollup.SUM },
              { fieldId: currentConfig.denFieldId, rollup: Rollup.SUM }
            ]
          };
          if (currentConfig.baseToken) cond.baseToken = currentConfig.baseToken;
          if (currentConfig.groupFieldId) {
            cond.groups = [{
              fieldId: currentConfig.groupFieldId,
              mode: GroupMode.INTEGRATED,
              sort: { order: ORDER.ASCENDING, sortType: DATA_SOURCE_SORT_TYPE.VALUE }
            }];
          }
          return cond;
        }

        function renderCard(sumNum, sumDen) {
          setError('');
          applyStyles();
          uiTitle.textContent = currentConfig.title || 'TỶ LỆ QUẢNG CÁO';
          const ratio = sumDen !== 0 ? (sumNum / sumDen) * 100 : 0;
          uiValue.textContent = formatVN(ratio, currentConfig.precision) + '%';
          if (currentConfig.showSub) {
            uiSub.style.display = 'block';
            uiSub.textContent = `Ads: ${formatVN(sumNum, 0)} / DT: ${formatVN(sumDen, 0)}`;
          } else {
            uiSub.style.display = 'none';
          }
        }

        async function computeAndRender(overrideMatrix = null) {
          try {
            if (Array.isArray(overrideMatrix) && overrideMatrix.length >= 2) {
              const { sumNum, sumDen } = sumFromIData(overrideMatrix);
              renderCard(sumNum, sumDen);
              if (activeDashboard.setRendered) activeDashboard.setRendered();
              return;
            }

            if (isConfigMode) {
              if (!currentConfig.tableId || !currentConfig.numFieldId || !currentConfig.denFieldId) return;
              const previewMatrix = await activeDashboard.getPreviewData(buildDataCondition());
              const { sumNum, sumDen } = sumFromIData(previewMatrix);
              renderCard(sumNum, sumDen);
              if (activeDashboard.setRendered) activeDashboard.setRendered();
              return;
            }

            try {
              const viewMatrix = await activeDashboard.getData();
              const { sumNum, sumDen } = sumFromIData(viewMatrix);
              renderCard(sumNum, sumDen);
              if (activeDashboard.setRendered) activeDashboard.setRendered();
            } catch (viewErr) {
              console.warn('activeDashboard.getData() lỗi, thử dashboardSdk.getData():', viewErr);
              try {
                const rootMatrix = await dashboardSdk.getData();
                const { sumNum, sumDen } = sumFromIData(rootMatrix);
                renderCard(sumNum, sumDen);
                if (dashboardSdk.setRendered) dashboardSdk.setRendered();
              } catch (rootErr) {
                const fbMatrix = await activeDashboard.getPreviewData(buildDataCondition());
                const { sumNum, sumDen } = sumFromIData(fbMatrix);
                renderCard(sumNum, sumDen);
                setError('Hãy bấm [...] -> Thiết lập -> Lưu vào Dashboard 1 lần.');
              }
            }
          } catch (err) {
            setError('Lỗi dữ liệu: ' + (err?.message || String(err)));
          }
        }

        if (isConfigMode) {
          baseSelect.innerHTML = '';
          if (availableBases.length > 0) {
            availableBases.forEach(b => {
              const opt = document.createElement('option');
              opt.value = b.token;
              opt.textContent = b.name;
              baseSelect.appendChild(opt);
            });
            baseSelect.value = currentConfig.baseToken;
          } else {
            const opt = document.createElement('option');
            opt.value = currentConfig.baseToken || '';
            opt.textContent = 'Base hiện tại';
            baseSelect.appendChild(opt);
          }

          titleInput.value = currentConfig.title;
          precisionSelect.value = String(currentConfig.precision);
          showSubCheck.checked = currentConfig.showSub;
          titleSizeInput.value = String(currentConfig.titleSize);
          valueSizeInput.value = String(currentConfig.valueSize);
          subSizeInput.value = String(currentConfig.subSize);
          alignSelect.value = currentConfig.align;
          valueColorInput.value = currentConfig.valueColor || '#1f2329';

          async function loadTablesForCurrentBase() {
            const tables = (await activeBitable.base.getTableMetaList()) || [];
            tableSelect.innerHTML = '';
            tables.forEach(t => {
              const opt = document.createElement('option');
              opt.value = t.id;
              opt.textContent = t.name;
              tableSelect.appendChild(opt);
            });
            if (!currentConfig.tableId || !tables.some(t => t.id === currentConfig.tableId)) {
              const tracking = tables.find(t => t.name.toUpperCase().includes('TRACKING'));
              currentConfig.tableId = tracking ? tracking.id : (tables[0]?.id || '');
            }
            tableSelect.value = currentConfig.tableId;
            await loadRangesAndFields(currentConfig.tableId);
          }

          async function loadRangesAndFields(tableId) {
            if (!tableId) return;

            try {
              const ranges = await activeDashboard.getTableDataRange(tableId);
              availableRanges = Array.isArray(ranges) && ranges.length > 0 ? ranges : [{ type: SourceType.ALL }];
            } catch (e) {
              availableRanges = [{ type: SourceType.ALL }];
            }

            rangeSelect.innerHTML = '';
            availableRanges.forEach((r, idx) => {
              const opt = document.createElement('option');
              opt.value = String(idx);
              opt.textContent = r.type === SourceType.ALL ? 'Toàn bộ dữ liệu' : `View: ${r.viewName || r.viewId}`;
              rangeSelect.appendChild(opt);
            });
            const matchedIdx = availableRanges.findIndex(r =>
              r.type === currentConfig.dataRange?.type &&
              (!r.viewId || r.viewId === currentConfig.dataRange?.viewId)
            );
            rangeSelect.value = String(matchedIdx >= 0 ? matchedIdx : 0);
            currentConfig.dataRange = availableRanges[Number(rangeSelect.value)] || { type: SourceType.ALL };

            let categories = [];
            try {
              categories = await activeDashboard.getCategories(tableId);
            } catch (e) {
              const tbl = await activeBitable.base.getTableById(tableId);
              const metas = await tbl.getFieldMetaList();
              categories = metas.map(m => ({ fieldId: m.id, fieldName: m.name, fieldType: m.type }));
            }

            const fill = (sel) => {
              sel.innerHTML = '';
              categories.forEach(c => {
                const opt = document.createElement('option');
                opt.value = c.fieldId;
                opt.textContent = c.fieldName;
                sel.appendChild(opt);
              });
            };
            fill(groupFieldSelect);
            fill(numFieldSelect);
            fill(denFieldSelect);

            if (!categories.some(c => c.fieldId === currentConfig.groupFieldId)) {
              const shopCat = categories.find(c => /TÊN SHOP|^SHOP$/i.test(c.fieldName.trim())) || categories[0];
              currentConfig.groupFieldId = shopCat?.fieldId || '';
            }
            if (!categories.some(c => c.fieldId === currentConfig.numFieldId)) {
              const adsCat = categories.find(c => /CHI PHÍ ADS|CHI PHÍ QUẢNG CÁO/i.test(c.fieldName)) || categories[0];
              currentConfig.numFieldId = adsCat?.fieldId || '';
            }
            if (!categories.some(c => c.fieldId === currentConfig.denFieldId)) {
              const revCat = categories.find(c => /DOANH THU THUẦN|DOANH THU/i.test(c.fieldName)) || categories[1] || categories[0];
              currentConfig.denFieldId = revCat?.fieldId || '';
            }

            groupFieldSelect.value = currentConfig.groupFieldId;
            numFieldSelect.value = currentConfig.numFieldId;
            denFieldSelect.value = currentConfig.denFieldId;

            await computeAndRender();
          }

          await loadTablesForCurrentBase();

          baseSelect.addEventListener('change', async () => {
            currentConfig.baseToken = baseSelect.value;
            currentConfig.tableId = '';
            await switchBitableInstance(currentConfig.baseToken);
            await loadTablesForCurrentBase();
          });

          tableSelect.addEventListener('change', async () => {
            currentConfig.tableId = tableSelect.value;
            currentConfig.groupFieldId = '';
            currentConfig.numFieldId = '';
            currentConfig.denFieldId = '';
            await loadRangesAndFields(currentConfig.tableId);
          });

          // Thay đổi nguồn dữ liệu -> tính lại
          const onDataFormChange = async () => {
            currentConfig.dataRange = availableRanges[Number(rangeSelect.value)] || { type: SourceType.ALL };
            currentConfig.groupFieldId = groupFieldSelect.value;
            currentConfig.numFieldId = numFieldSelect.value;
            currentConfig.denFieldId = denFieldSelect.value;
            currentConfig.precision = Number(precisionSelect.value);
            await computeAndRender();
          };
          [rangeSelect, groupFieldSelect, numFieldSelect, denFieldSelect, precisionSelect].forEach(el => {
            el.addEventListener('change', onDataFormChange);
          });

          // Thay đổi hiển thị -> chỉ cập nhật giao diện, không gọi lại dữ liệu
          const onStyleChange = () => {
            currentConfig.title = titleInput.value;
            currentConfig.showSub = showSubCheck.checked;
            currentConfig.titleSize = clampInt(titleSizeInput.value, 8, 60, 13);
            currentConfig.valueSize = clampInt(valueSizeInput.value, 0, 200, 0);
            currentConfig.subSize = clampInt(subSizeInput.value, 8, 40, 11);
            currentConfig.align = alignSelect.value;
            currentConfig.valueColor = valueColorInput.value;
            applyStyles();
            uiTitle.textContent = currentConfig.title || 'TỶ LỆ QUẢNG CÁO';
            uiSub.style.display = currentConfig.showSub ? 'block' : 'none';
          };
          [titleInput, titleSizeInput, valueSizeInput, subSizeInput, valueColorInput].forEach(el => {
            el.addEventListener('input', onStyleChange);
          });
          [alignSelect, showSubCheck].forEach(el => el.addEventListener('change', onStyleChange));

          saveBtn.addEventListener('click', async () => {
            saveBtn.disabled = true;
            saveBtn.textContent = 'Đang lưu...';
            try {
              onStyleChange();
              await activeDashboard.saveConfig({
                dataConditions: [buildDataCondition()],
                customConfig: { ...currentConfig }
              });
            } catch (err) {
              setError('Lỗi khi lưu: ' + (err?.message || String(err)));
              saveBtn.disabled = false;
              saveBtn.textContent = 'Lưu vào Dashboard';
            }
          });
        } else {
          await computeAndRender();
        }

        // onDataChange: theo tài liệu Feishu, kích hoạt khi dữ liệu bảng / bộ lọc toàn cục của Dashboard thay đổi
        const handleDataChange = async (ev) => {
          const incoming = ev?.data ?? ev;
          if (Array.isArray(incoming) && incoming.length >= 2) {
            await computeAndRender(incoming);
          }
          setTimeout(() => computeAndRender(), 600);
        };
        activeDashboard.onDataChange(handleDataChange);
        if (activeDashboard !== dashboardSdk) dashboardSdk.onDataChange(handleDataChange);

        const handleConfigChange = async (ev) => {
          parseSavedConfig(ev?.data ?? ev);
          applyStyles();
          await switchBitableInstance(currentConfig.baseToken);
          await computeAndRender();
        };
        activeDashboard.onConfigChange(handleConfigChange);
        if (activeDashboard !== dashboardSdk) dashboardSdk.onConfigChange(handleConfigChange);
      } catch (err) {
        setError('Lỗi khởi tạo: ' + (err?.message || String(err)));
      }
    }

    init();
  </script>
</body>
</html>
