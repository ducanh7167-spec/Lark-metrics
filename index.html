<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <script src="https://lf-cdn.baseopen.feishu.cn/obj/open-js-sdk/bitable/index.1.20.0.js"></script>
  <style>
    body {
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #ffffff;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .label {
      font-size: 13px;
      font-weight: 600;
      color: #646a73;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }
    .val {
      font-size: 32px;
      font-weight: 700;
      color: #1f2329;
    }
    .sub {
      font-size: 12px;
      color: #8f959e;
      margin-top: 4px;
    }
    .err {
      color: #f54a45;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="label">TỶ LỆ QUẢNG CÁO (CHUẨN)</div>
  <div class="val" id="metric-val">Đang quét dữ liệu...</div>
  <div class="sub" id="metric-sub"></div>

  <script>
    async function init() {
      const valEl = document.getElementById('metric-val');
      const subEl = document.getElementById('metric-sub');
      
      try {
        if (!window.bitable) {
          valEl.innerText = 'Chờ SDK...';
          return;
        }

        const table = await window.bitable.base.getActiveTable();
        const fieldMetaList = await table.getFieldMetaList();
        
        // Tự động tìm cột Ads và Doanh thu không phân biệt hoa thường
        const adsMeta = fieldMetaList.find(f => {
          const name = f.name.toLowerCase();
          return name.includes('quảng cáo') || name.includes('ads') || name.includes('chi phí');
        });

        const revMeta = fieldMetaList.find(f => {
          const name = f.name.toLowerCase();
          return name.includes('doanh thu thuần') || name.includes('thuần') || name.includes('nmv');
        });

        if (!adsMeta || !revMeta) {
          valEl.className = 'val err';
          valEl.innerText = 'Không tìm thấy cột';
          subEl.innerText = `Ads: ${adsMeta ? adsMeta.name : 'Chưa có'} | DT: ${revMeta ? revMeta.name : 'Chưa có'}`;
          return;
        }

        const adsField = await table.getFieldById(adsMeta.id);
        const revField = await table.getFieldById(revMeta.id);

        const view = await table.getActiveView();
        const recordIds = await view.getVisibleRecordIdList();

        let totalAds = 0;
        let totalRev = 0;

        for (const id of recordIds) {
          const a = await adsField.getValue(id);
          const r = await revField.getValue(id);
          
          if (typeof a === 'number') totalAds += a;
          else if (a && a.value) totalAds += Number(a.value) || 0;

          if (typeof r === 'number') totalRev += r;
          else if (r && r.value) totalRev += Number(r.value) || 0;
        }

        const ratio = totalRev > 0 ? ((totalAds / totalRev) * 100).toFixed(2) : '0.00';
        
        valEl.className = 'val';
        valEl.innerText = ratio + '%';
        subEl.innerText = `Ads: ${new Intl.NumberFormat('vi-VN').format(totalAds)} / DT: ${new Intl.NumberFormat('vi-VN').format(totalRev)}`;

      } catch (err)
