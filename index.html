<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tỷ lệ Quảng cáo - Lark Dashboard</title>
  <style>
    :root {
      --bg-color: #ffffff;
      --text-primary: #1f2329;
      --text-secondary: #646a73;
      --text-muted: #8f959e;
      --border-color: #dee0e3;
      --accent-color: #3370ff;
      --panel-bg: #f8f9fa;
    }

    body[data-theme="dark"] {
      --bg-color: #191919;
      --text-primary: #f0f0f0;
      --text-secondary: #a6a6a6;
      --text-muted: #757575;
      --border-color: #303030;
      --panel-bg: #222222;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-primary);
      overflow: hidden;
    }

    .app-container {
      display: flex;
      width: 100%;
      height: 100%;
    }

    /* THẺ HIỂN THỊ KẾT QUẢ TRÊN DASHBOARD */
    .metric-card {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 16px 20px;
      min-width: 0;
    }

    .metric-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.4px;
      margin-bottom: 8px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .metric-value {
      font-size: clamp(24px, 5vw, 36px);
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.15;
      font-variant-numeric: tabular-nums;
    }

    .metric-sub {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 6px;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* KHUNG CHỌN NHANH 2 KHỐI (CHỈ HIỆN KHI CẤU HÌNH) */
    .config-panel {
      width: 320px;
      border-left: 1px solid var(--border-color);
      background-color: var(--panel-bg);
      padding: 16px;
      display: none;
      flex-direction: column;
      gap: 14px;
      justify-content: center;
    }

    .app-container.is-config .config-panel {
      display: flex;
    }

    .config-header {
      font-size: 14px;
      font-weight: 600;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border-color);
    }

    .field-box {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field-box label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .field-box select,
    .field-box input {
      width: 100%;
      padding: 9px 10px;
      font-size: 13px;
      font-weight: 500;
      border: 1.5px solid var(--border-color);
      border-radius: 6px;
      background-color: var(--bg-color);
      color: var(--text-primary);
      outline: none;
      cursor: pointer;
    }

    .field-box select:focus,
    .field-box input:focus {
      border-color: var(--accent-color);
    }

    .divider-line {
      text-align: center;
      font-size: 13px;
      font-weight: 700;
      color: var(--accent-color);
      margin: -4px 0;
    }

    .btn-save {
      margin-top: 6px;
      padding: 10px;
      font-size: 13px;
      font-weight: 600;
      color: #ffffff;
      background-color: var(--accent-color);
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    .btn-save:hover { opacity: 0.9; }
    .btn-save:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="app-container" id="app-container">
    <!-- Thẻ Metric chính -->
    <div class="metric-card">
      <div class="metric-label" id="metric-label">TỶ LỆ QUẢNG CÁO</div>
      <div class="metric-value" id="metric-val">Đang tính...</div>
      <div class="metric-sub" id="metric-sub"></div>
    </div>

    <!-- Giao diện rút gọn: Chỉ chọn Khối Tử Số & Khối Mẫu Số -->
    <div class="config-panel">
      <div class="config-header">Chọn 2 khối chỉ số để chia</div>

      <div class="field-box">
        <label for="sel-num">1. Khối Tử số (Số bị chia)</label>
        <select id="sel-num">
          <option>Đang quét các khối trên Dashboard...</option>
        </select>
      </div>

      <div class="divider-line">÷ CHIA CHO ÷</div>

      <div class="field-box">
        <label for="sel-den">2. Khối Mẫu số (Số chia)</label>
        <select id="sel-den">
          <option>Đang quét các khối trên Dashboard...</option>
        </select>
      </div>

      <div class="field-box">
        <label for="inp-title">Tên thẻ hiển thị</label>
        <input type="text" id="inp-title" value="TỶ LỆ QUẢNG CÁO" />
      </div>

      <button class="btn-save" id="btn-save">Lưu vào Dashboard</button>
    </div>
  </div>

  <script type="module">
    async function loadSDK() {
      for (const url of [
        'https://cdn.jsdelivr.net/npm/@lark-base-open/js-sdk@1.0.2/+esm',
        'https://esm.sh/@lark-base-open/js-sdk@1.0.2'
      ]) {
        try { return await import(url); } catch (_) {}
      }
      throw new Error('Không tải được Lark SDK');
    }

    const appEl = document.getElementById('app-container');
    const labelEl = document.getElementById('metric-label');
    const valEl = document.getElementById('metric-val');
    const subEl = document.getElementById('metric-sub');
    const selNum = document.getElementById('sel-num');
    const selDen = document.getElementById('sel-den');
    const inpTitle = document.getElementById('inp-title');
    const btnSave = document.getElementById('btn-save');

    const fmtNum = new Intl.NumberFormat('vi-VN', { maximumFractionDigits: 0 });
    const fmtPct = new Intl.NumberFormat('vi-VN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

    function renderMetric(adsVal, revVal, title) {
      if (title) labelEl.textContent = title;
      const a = typeof adsVal === 'number' ? adsVal : (parseFloat(String(adsVal ?? '0')) || 0);
      const b = typeof revVal === 'number' ? revVal : (parseFloat(String(revVal ?? '0')) || 0);
      const pct = b > 0 ? (a / b) * 100 : 0;

      valEl.textContent = `${fmtPct.format(pct)}%`;
      subEl.textContent = `Ads: ${fmtNum.format(a)} / DT: ${fmtNum.format(b)}`;
    }

    // Tự động quét bảng TRACKING ALL và lọc ra đúng các khối chỉ số tổng quan kèm giá trị thực tế
    async function getDashboardMetricBlocks(base, dashboard, Rollup, SourceType, FieldType) {
      const tables = await base.getTableMetaList();
      const trackingMeta =
        tables.find(t => t.name.toLowerCase().includes('tracking all')) ||
        tables.find(t => t.name.toLowerCase().includes('tracking')) ||
        tables[0];

      const table = await base.getTableById(trackingMeta.id);
      const allFields = await table.getFieldMetaList();

      // Chỉ giữ lại các cột kiểu Số, Tiền tệ, Công thức, Lookup (loại bỏ cột Ngày, Shop, Text...)
      const allowedTypes = new Set([
        FieldType?.Number ?? 2,
        FieldType?.Formula ?? 20,
        FieldType?.Lookup ?? 19,
        FieldType?.Currency ?? 99003
      ]);

      // Loại bỏ các cột "Tỷ lệ / %" trung bình cộng để tránh chọn nhầm
      let metricFields = allFields.filter(
        f => allowedTypes.has(f.type) && !/tỷ lệ|%|ngày|tháng|năm/i.test(f.name)
      );
      if (metricFields.length < 2) metricFields = allFields;

      const sumRollup = Rollup?.SUM || 'SUM';
      const allType = SourceType?.ALL || 'ALL';

      // Lấy luôn tổng (SUM) của toàn bộ các cột này trong 1 lần gọi duy nhất
      const seriesList = metricFields.map(f => ({ fieldId: f.id, rollup: sumRollup }));
      let sumRow = [];
      try {
        const pData = await dashboard.getPreviewData({
          tableId: trackingMeta.id,
          dataRange: { type: allType },
          groups: [],
          series: seriesList
        });
        sumRow = pData?.[1] || [];
      } catch (_) {}

      const blocks = metricFields.map((f, idx) => {
        const raw = sumRow[idx]?.value;
        const val = typeof raw === 'number' ? raw : (parseFloat(String(raw ?? '0')) || 0);
        return {
          tableId: trackingMeta.id,
          fieldId: f.id,
          name: f.name.toUpperCase(),
          value: val
        };
      });

      return { tableId: trackingMeta.id, blocks };
    }

    async function init() {
      const sdk = await loadSDK();
      const { bitable, DashboardState, Rollup, SourceType, FieldType } = sdk;
      const { dashboard, base } = bitable;

      try {
        const theme = await dashboard.getTheme();
        document.body.setAttribute('data-theme', (theme?.theme || '').toLowerCase() === 'dark' ? 'dark' : 'light');
        dashboard.onThemeChange(ev => {
          document.body.setAttribute('data-theme', (ev.data?.theme || '').toLowerCase() === 'dark' ? 'dark' : 'light');
        });
      } catch (_) {}

      const isConfig =
        dashboard.state === DashboardState.Create ||
        dashboard.state === DashboardState.Config ||
        location.href.includes('isCreate=1') ||
        location.href.includes('isConfig=1');

      // ================= 1. CHẾ ĐỘ HIỂN THỊ TRÊN DASHBOARD =================
      if (!isConfig) {
        let title = 'TỶ LỆ QUẢNG CÁO';
        const loadAndShow = async (incomingData) => {
          try {
            const cfg = await dashboard.getConfig();
            if (cfg?.customConfig?.title) title = cfg.customConfig.title;
          } catch (_) {}

          let data = incomingData;
          if (!Array.isArray(data) || data.length < 2) {
            data = await dashboard.getData();
          }
          renderMetric(data?.[1]?.[0]?.value, data?.[1]?.[1]?.value, title);
          await dashboard.setRendered();
        };

        await loadAndShow();
        // Tự động nhảy số khi người dùng đổi bộ lọc Slicer (SHOP, NGÀY, THÁNG)
        dashboard.onDataChange(ev => loadAndShow(ev?.data));
        dashboard.onConfigChange(() => loadAndShow());
        return;
      }

      // ================= 2. CHẾ ĐỘ CẤU HÌNH (CHỌN NHANH 2 KHỐI) =================
      appEl.classList.add('is-config');
      const { tableId, blocks } = await getDashboardMetricBlocks(base, dashboard, Rollup, SourceType, FieldType);

      // Đổ danh sách dạng: "📊 CHI PHÍ QUẢNG CÁO (275.276.113)"
      const optionsHtml = blocks
        .map(b => `<option value="${b.fieldId}">📊 ${b.name} (${fmtNum.format(b.value)})</option>`)
        .join('');

      selNum.innerHTML = optionsHtml;
      selDen.innerHTML = optionsHtml;

      // Tự động chọn sẵn Khối CHI PHÍ QUẢNG CÁO và Khối DOANH THU THUẦN
      const defaultNum =
        blocks.find(b => /chi phí.*(quảng cáo|ads)|quảng cáo|ads/i.test(b.name)) || blocks[0];
      const defaultDen =
        blocks.find(b => /doanh thu thuần|dt thuần|nmv|doanh thu/i.test(b.name)) || blocks[1] || blocks[0];

      if (defaultNum) selNum.value = defaultNum.fieldId;
      if (defaultDen) selDen.value = defaultDen.fieldId;

      // Nếu đang sửa lại cấu hình cũ thì nạp lại đúng 2 khối đã chọn
      if (dashboard.state === DashboardState.Config) {
        try {
          const saved = await dashboard.getConfig();
          const s = saved?.dataConditions?.[0]?.series;
          if (Array.isArray(s) && s.length >= 2) {
            if (blocks.some(b => b.fieldId === s[0].fieldId)) selNum.value = s[0].fieldId;
            if (blocks.some(b => b.fieldId === s[1].fieldId)) selDen.value = s[1].fieldId;
          }
          if (saved?.customConfig?.title) inpTitle.value = saved.customConfig.title;
        } catch (_) {}
      }

      const updatePreview = () => {
        const bNum = blocks.find(b => b.fieldId === selNum.value);
        const bDen = blocks.find(b => b.fieldId === selDen.value);
        renderMetric(bNum?.value || 0, bDen?.value || 0, inpTitle.value.trim() || 'TỶ LỆ QUẢNG CÁO');
      };

      updatePreview();
      selNum.addEventListener('change', updatePreview);
      selDen.addEventListener('change', updatePreview);
      inpTitle.addEventListener('input', updatePreview);

      btnSave.addEventListener('click', async () => {
        btnSave.disabled = true;
        btnSave.textContent = 'Đang lưu...';
        const sumRollup = Rollup?.SUM || 'SUM';
        const allType = SourceType?.ALL || 'ALL';
        await dashboard.saveConfig({
          dataConditions: [
            {
              tableId,
              dataRange: { type: allType },
              groups: [],
              series: [
                { fieldId: selNum.value, rollup: sumRollup },
                { fieldId: selDen.value, rollup: sumRollup }
              ]
            }
          ],
          customConfig: {
            title: inpTitle.value.trim() || 'TỶ LỆ QUẢNG CÁO'
          }
        });
      });
    }

    init();
  </script>
</body>
</html>
