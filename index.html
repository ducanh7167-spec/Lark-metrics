<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tỷ lệ Quảng cáo - TAV Dashboard</title>
  <style>
    :root {
      --bg-color: #ffffff;
      --text-primary: #1f2329;
      --text-secondary: #646a73;
      --text-muted: #8f959e;
      --border-color: #dee0e3;
      --accent-color: #3370ff;
      --panel-bg: #f8f9fa;
      --card-bg: #ffffff;
    }

    body[data-theme="dark"] {
      --bg-color: #191919;
      --text-primary: #f0f0f0;
      --text-secondary: #a6a6a6;
      --text-muted: #757575;
      --border-color: #303030;
      --panel-bg: #222222;
      --card-bg: #2a2a2a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-primary);
      overflow: hidden;
    }

    .app-container {
      display: flex;
      width: 100%;
      height: 100%;
    }

    /* THẺ METRIC HIỂN THỊ TRÊN DASHBOARD */
    .metric-card {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 16px 20px;
      min-width: 0;
    }

    .metric-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.4px;
      margin-bottom: 8px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .metric-value {
      font-size: clamp(24px, 5vw, 36px);
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.15;
      font-variant-numeric: tabular-nums;
    }

    .metric-sub {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 6px;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* PANEL XÁC NHẬN 1-CLICK (KHÔNG CẦN CHỌN TRƯỜNG TRONG BẢNG) */
    .config-panel {
      width: 330px;
      border-left: 1px solid var(--border-color);
      background-color: var(--panel-bg);
      padding: 16px;
      display: none;
      flex-direction: column;
      gap: 12px;
      justify-content: center;
    }

    .app-container.is-config .config-panel {
      display: flex;
    }

    .config-header {
      font-size: 14px;
      font-weight: 600;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border-color);
    }

    .preset-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .preset-item {
      background: var(--card-bg);
      border: 1.5px solid var(--border-color);
      border-radius: 8px;
      padding: 10px 12px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .preset-item.active {
      border-color: var(--accent-color);
      background: rgba(51, 112, 255, 0.06);
    }

    .preset-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 3px;
      display: flex;
      justify-content: space-between;
    }

    .preset-desc {
      font-size: 11px;
      color: var(--text-secondary);
    }

    .btn-save {
      margin-top: 8px;
      padding: 11px;
      font-size: 13px;
      font-weight: 600;
      color: #ffffff;
      background-color: var(--accent-color);
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    .btn-save:hover { opacity: 0.92; }
    .btn-save:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="app-container" id="app-container">
    <!-- Thẻ Metric -->
    <div class="metric-card">
      <div class="metric-label" id="metric-label">TỶ LỆ QUẢNG CÁO</div>
      <div class="metric-value" id="metric-val">Đang tính...</div>
      <div class="metric-sub" id="metric-sub"></div>
    </div>

    <!-- Bảng chọn sẵn theo Khối Dashboard (Không cần chọn trường) -->
    <div class="config-panel">
      <div class="config-header">Chọn công thức Khối Dashboard</div>
      <div class="preset-list" id="preset-list"></div>
      <button class="btn-save" id="btn-save">Xác nhận & Lưu vào Dashboard</button>
    </div>
  </div>

  <script type="module">
    async function loadSDK() {
      for (const url of [
        'https://cdn.jsdelivr.net/npm/@lark-base-open/js-sdk@1.0.2/+esm',
        'https://esm.sh/@lark-base-open/js-sdk@1.0.2'
      ]) {
        try { return await import(url); } catch (_) {}
      }
      throw new Error('Không tải được Lark SDK');
    }

    const appEl = document.getElementById('app-container');
    const labelEl = document.getElementById('metric-label');
    const valEl = document.getElementById('metric-val');
    const subEl = document.getElementById('metric-sub');
    const presetListEl = document.getElementById('preset-list');
    const btnSave = document.getElementById('btn-save');

    const fmtNum = new Intl.NumberFormat('vi-VN', { maximumFractionDigits: 0 });
    const fmtPct = new Intl.NumberFormat('vi-VN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const norm = (s) => String(s || '').normalize('NFC').trim().toUpperCase();

    function renderCard(numVal, denVal, title) {
      if (title) labelEl.textContent = title;
      const a = typeof numVal === 'number' ? numVal : (parseFloat(String(numVal ?? '0')) || 0);
      const b = typeof denVal === 'number' ? denVal : (parseFloat(String(denVal ?? '0')) || 0);
      const pct = b > 0 ? (a / b) * 100 : 0;

      valEl.textContent = `${fmtPct.format(pct)}%`;
      subEl.textContent = `Ads: ${fmtNum.format(a)} / DT: ${fmtNum.format(b)}`;
    }

    // Tự động tìm đúng bảng chứa cột DOANH THU THUẦN & CHI PHÍ ADS BAO GỒM VAT
    async function detectTAVBlocks(base, dashboard, SourceType) {
      const tables = await base.getTableMetaList();
      let chosenTableId = tables[0]?.id;
      let chosenFields = [];

      // Quét tìm bảng có chứa cột DOANH THU THUẦN hoặc CHI PHÍ ADS
      for (const tMeta of tables) {
        const t = await base.getTableById(tMeta.id);
        const fList = await t.getFieldMetaList();
        const hasRev = fList.some(f => norm(f.name).includes('DOANH THU THUẦN') || norm(f.name) === 'NMV');
        const hasAds = fList.some(f => norm(f.name).includes('CHI PHÍ'));
        if (hasRev && hasAds) {
          chosenTableId = tMeta.id;
          chosenFields = fList;
          break;
        }
        if (chosenFields.length === 0) {
          chosenTableId = tMeta.id;
          chosenFields = fList;
        }
      }

      // Khớp chính xác tên cột trong Base TAV - MASTER ONE (tuyệt đối không nhầm vào CVR ADS / CLICK)
      const adsField =
        chosenFields.find(f => norm(f.name) === 'CHI PHÍ ADS BAO GỒM VAT') ||
        chosenFields.find(f => norm(f.name).startsWith('CHI PHÍ ADS')) ||
        chosenFields.find(f => norm(f.name).startsWith('CHI PHÍ QUẢNG CÁO')) ||
        chosenFields.find(f => norm(f.name).includes('CHI PHÍ'));

      const revField =
        chosenFields.find(f => norm(f.name) === 'DOANH THU THUẦN') ||
        chosenFields.find(f => norm(f.name).includes('DOANH THU THUẦN')) ||
        chosenFields.find(f => norm(f.name) === 'NMV');

      const gmvField =
        chosenFields.find(f => norm(f.name) === 'GMV') ||
        chosenFields.find(f => norm(f.name).includes('GMV') && !norm(f.name).includes('ACOS'));

      const cancelField =
        chosenFields.find(f => norm(f.name).includes('DOANH SỐ HOÀN HỦY')) ||
        chosenFields.find(f => norm(f.name) === 'HỦY');

      const ranges = await dashboard.getTableDataRange(chosenTableId);
      const allRange =
        ranges.find(r => r.type === (SourceType?.ALL || 'ALL')) || { type: SourceType?.ALL || 'ALL' };

      // Tạo danh sách các cặp Khối Dashboard dựng sẵn
      const presets = [];
      if (adsField && revField) {
        presets.push({
          id: 'ads_rev',
          title: 'TỶ LỆ QUẢNG CÁO',
          desc: `Khối CHI PHÍ QUẢNG CÁO ÷ Khối DOANH THU THUẦN`,
          numFieldId: adsField.id,
          denFieldId: revField.id
        });
      }
      if (adsField && gmvField) {
        presets.push({
          id: 'ads_gmv',
          title: 'TỶ LỆ ADS / GMV',
          desc: `Khối CHI PHÍ QUẢNG CÁO ÷ Khối GMV`,
          numFieldId: adsField.id,
          denFieldId: gmvField.id
        });
      }
      if (cancelField && gmvField) {
        presets.push({
          id: 'cancel_gmv',
          title: 'TỶ LỆ HOÀN HỦY',
          desc: `Khối DOANH SỐ HOÀN HỦY ÷ Khối GMV`,
          numFieldId: cancelField.id,
          denFieldId: gmvField.id
        });
      }

      return { tableId: chosenTableId, dataRange: allRange, presets };
    }

    // Lấy giá trị tổng SUM của 2 khối an toàn tuyệt đối (không truyền groups: [])
    async function fetchPairSum(dashboard, Rollup, tableId, dataRange, numFieldId, denFieldId) {
      const sumRollup = Rollup?.SUM || 'SUM';
      try {
        // Gọi tách riêng từng khối để đảm bảo 100% không bao giờ bị trả về 0
        const [resA, resB] = await Promise.all([
          dashboard.getPreviewData({
            tableId,
            dataRange,
            series: [{ fieldId: numFieldId, rollup: sumRollup }]
          }),
          dashboard.getPreviewData({
            tableId,
            dataRange,
            series: [{ fieldId: denFieldId, rollup: sumRollup }]
          })
        ]);
        return {
          numVal: resA?.[1]?.[0]?.value ?? 0,
          denVal: resB?.[1]?.[0]?.value ?? 0
        };
      } catch (e) {
        console.error('Lỗi fetchPairSum:', e);
        return { numVal: 0, denVal: 0 };
      }
    }

    async function init() {
      const sdk = await loadSDK();
      const { bitable, DashboardState, Rollup, SourceType } = sdk;
      const { dashboard, base } = bitable;

      try {
        const theme = await dashboard.getTheme();
        document.body.setAttribute('data-theme', (theme?.theme || '').toLowerCase() === 'dark' ? 'dark' : 'light');
        dashboard.onThemeChange(ev => {
          document.body.setAttribute('data-theme', (ev.data?.theme || '').toLowerCase() === 'dark' ? 'dark' : 'light');
        });
      } catch (_) {}

      const isConfig =
        dashboard.state === DashboardState.Create ||
        dashboard.state === DashboardState.Config ||
        location.href.includes('isCreate=1') ||
        location.href.includes('isConfig=1');

      // ================= 1. CHẾ ĐỘ HIỂN THỊ TRÊN DASHBOARD (VIEW) =================
      if (!isConfig) {
        const updateDashboardView = async (incomingData) => {
          let title = 'TỶ LỆ QUẢNG CÁO';
          let cfg = null;
          try {
            cfg = await dashboard.getConfig();
            if (cfg?.customConfig?.title) title = cfg.customConfig.title;
          } catch (_) {}

          // Đọc dữ liệu đã lọc bởi Slicer trên Dashboard từ getData()
          let data = incomingData;
          if (!Array.isArray(data) || data.length < 2) {
            try {
              data = await dashboard.getData();
            } catch (_) {}
          }

          if (Array.isArray(data?.[1]) && data[1].length >= 2) {
            renderCard(data[1][0]?.value, data[1][1]?.value, title);
          } else {
            // Fallback an toàn nếu chỉ trả về 1 cột
            const detected = await detectTAVBlocks(base, dashboard, SourceType);
            const p0 = detected.presets[0];
            if (p0) {
              const { numVal, denVal } = await fetchPairSum(
                dashboard,
                Rollup,
                detected.tableId,
                detected.dataRange,
                p0.numFieldId,
                p0.denFieldId
              );
              renderCard(numVal, denVal, title);
            }
          }
          await dashboard.setRendered();
        };

        await updateDashboardView();
        dashboard.onDataChange(ev => updateDashboardView(ev?.data));
        dashboard.onConfigChange(() => updateDashboardView());
        return;
      }

      // ================= 2. CHẾ ĐỘ CẤU HÌNH (1-CLICK, KHÔNG CHỌN TRƯỜNG) =================
      appEl.classList.add('is-config');
      const { tableId, dataRange, presets } = await detectTAVBlocks(base, dashboard, SourceType);

      let selectedPreset = presets[0];

      async function renderSelectedPreset() {
        if (!selectedPreset) return;
        presetListEl.innerHTML = presets
          .map(p => `
            <div class="preset-item ${p.id === selectedPreset.id ? 'active' : ''}" data-id="${p.id}">
              <div class="preset-title">
                <span>${p.title}</span>
                <span>${p.id === selectedPreset.id ? '✓ Đang chọn' : ''}</span>
              </div>
              <div class="preset-desc">${p.desc}</div>
            </div>
          `)
          .join('');

        presetListEl.querySelectorAll('.preset-item').forEach(el => {
          el.addEventListener('click', () => {
            selectedPreset = presets.find(p => p.id === el.dataset.id) || presets[0];
            renderSelectedPreset();
          });
        });

        const { numVal, denVal } = await fetchPairSum(
          dashboard,
          Rollup,
          tableId,
          dataRange,
          selectedPreset.numFieldId,
          selectedPreset.denFieldId
        );
        renderCard(numVal, denVal, selectedPreset.title);
      }

      await renderSelectedPreset();

      btnSave.addEventListener('click', async () => {
        if (!selectedPreset) return;
        btnSave.disabled = true;
        btnSave.textContent = 'Đang lưu...';
        const sumRollup = Rollup?.SUM || 'SUM';

        // LƯU Ý QUAN TRỌNG: Tuyệt đối KHÔNG truyền groups: [] để không bị lỗi "Nguồn dữ liệu đã thay đổi"
        await dashboard.saveConfig({
          dataConditions: [
            {
              tableId,
              dataRange,
              series: [
                { fieldId: selectedPreset.numFieldId, rollup: sumRollup },
                { fieldId: selectedPreset.denFieldId, rollup: sumRollup }
              ]
            }
          ],
          customConfig: {
            title: selectedPreset.title,
            presetId: selectedPreset.id
          }
        });
      });
    }

    init();
  </script>
</body>
</html>
