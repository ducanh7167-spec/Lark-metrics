<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <script src="https://lf-cdn.baseopen.feishu.cn/obj/open-js-sdk/bitable/index.1.20.0.js"></script>
  <style>
    body {
      margin: 0;
      padding: 12px 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: transparent;
      box-sizing: border-box;
    }
    .title {
      font-size: 13px;
      font-weight: 600;
      color: #646a73;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .value {
      font-size: 28px;
      font-weight: 700;
      color: #1f2329;
    }
  </style>
</head>
<body>
  <div class="title">TỶ LỆ QUẢNG CÁO</div>
  <div class="value" id="val">Đang tính...</div>

  <script>
    async function run() {
      try {
        const table = await window.bitable.base.getActiveTable();
        const view = await table.getActiveView();
        const recordIds = await view.getVisibleRecordIdList();

        // Tên chính xác 2 cột trong Base của bạn
        const adsField = await table.getFieldByName('CHI PHÍ QUẢNG CÁO (VND)');
        const revField = await table.getFieldByName('DOANH THU THUẦN (VND)');

        let totalAds = 0;
        let totalRev = 0;

        for (const id of recordIds) {
          const ads = await adsField.getValue(id);
          const rev = await revField.getValue(id);
          if (typeof ads === 'number') totalAds += ads;
          if (typeof rev === 'number') totalRev += rev;
        }

        const ratio = totalRev > 0 ? ((totalAds / totalRev) * 100).toFixed(2) + '%' : '0.00%';
        document.getElementById('val').innerText = ratio;
      } catch (e) {
        document.getElementById('val').innerText = 'Lỗi tính toán';
        console.error(e);
      }
    }

    if (window.bitable) {
      window.bitable.base.onSelectionChange(run);
      run();
    }
  </script>
</body>
</html>
