<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lark Dashboard Weighted Ratio Extension</title>
  <style>
    :root {
      --bg-card: #ffffff;
      --text-title: #646a73;
      --text-main: #1f2329;
      --text-sub: #8f959e;
      --border-color: #dee0e3;
      --primary: #3370ff;
      --primary-hover: #245bdb;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: var(--bg-card);
      color: var(--text-main);
      overflow: hidden;
    }
    #app {
      display: flex;
      width: 100%;
      height: 100%;
    }

    /* Khu vực hiển thị thẻ Metric */
    .preview-pane {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 14px 18px;
      min-width: 0;
      overflow: hidden;
      position: relative;
    }
    .metric-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-title);
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 6px;
      letter-spacing: 0.2px;
    }
    .metric-value {
      font-size: clamp(24px, 14vw, 36px);
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.15;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-variant-numeric: tabular-nums;
    }
    .metric-sub {
      margin-top: 6px;
      font-size: 11px;
      color: var(--text-sub);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .unconfigured-badge {
      display: none;
      margin-top: 6px;
      padding: 4px 8px;
      background: #fff7e6;
      border: 1px solid #ffd591;
      border-radius: 4px;
      color: #d46b08;
      font-size: 11px;
      line-height: 1.35;
    }
    .unconfigured-badge.visible {
      display: inline-block;
    }

    /* Khu vực cấu hình bên phải (chỉ hiện ở chế độ Create / Config) */
    .config-pane {
      width: 330px;
      border-left: 1px solid var(--border-color);
      padding: 16px;
      display: none;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
      background: #fafbfc;
    }
    #app.is-config .config-pane {
      display: flex;
    }
    .config-header {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-main);
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border-color);
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .form-group label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-title);
    }
    .form-hint {
      font-size: 11px;
      color: var(--text-sub);
      line-height: 1.35;
    }
    .form-control {
      width: 100%;
      padding: 7px 10px;
      font-size: 13px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      background: #fff;
      color: var(--text-main);
      outline: none;
      transition: border-color 0.15s;
    }
    .form-control:focus {
      border-color: var(--primary);
    }
    .row-2col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .checkbox-line {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text-main);
      cursor: pointer;
      user-select: none;
    }
    .btn-save {
      margin-top: auto;
      padding: 10px 14px;
      background: var(--primary);
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-save:hover {
      background: var(--primary-hover);
    }
    .btn-save:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .error-msg {
      color: #f54a45;
      font-size: 12px;
      margin-top: 4px;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- Màn hình hiển thị thẻ tỷ lệ -->
    <div class="preview-pane">
      <div class="metric-label" id="ui-title">TỶ LỆ QUẢNG CÁO</div>
      <div class="metric-value" id="ui-value">--%</div>
      <div class="metric-sub" id="ui-sub">Đang tải dữ liệu...</div>
      <div class="unconfigured-badge" id="ui-badge">
        ⚠️ Chưa liên kết Slicer: Bấm <b>"..."</b> góc phải khối ➔ <b>Cấu hình</b> ➔ <b>Lưu vào Dashboard</b>
      </div>
      <div class="error-msg" id="ui-error" style="display:none;"></div>
    </div>

    <!-- Bảng cấu hình (chỉ xuất hiện khi Thêm mới hoặc bấm Cấu hình) -->
    <div class="config-pane">
      <div class="config-header">Cấu hình Tỷ lệ Trọng số (ΣA / ΣB)</div>

      <div class="form-group">
        <label for="sel-table">1. Bảng dữ liệu nguồn</label>
        <select id="sel-table" class="form-control"></select>
      </div>

      <div class="form-group">
        <label for="sel-group">2. Trường phân nhóm (Bắt buộc để Slicer nhận diện)</label>
        <select id="sel-group" class="form-control"></select>
        <div class="form-hint">Chọn <b>TÊN SHOP</b> (hoặc cột phân loại bất kỳ) để Lark kích hoạt liên kết với mọi bộ lọc Slicer trên Dashboard.</div>
      </div>

      <div class="form-group">
        <label for="sel-num">3. Tử số — Tổng A (VD: CHI PHÍ ADS BAO GỒM VAT)</label>
        <select id="sel-num" class="form-control"></select>
      </div>

      <div class="form-group">
        <label for="sel-den">4. Mẫu số — Tổng B (VD: DOANH THU THUẦN)</label>
        <select id="sel-den" class="form-control"></select>
      </div>

      <div class="form-group">
        <label for="inp-title">5. Tiêu đề thẻ</label>
        <input id="inp-title" type="text" class="form-control" value="TỶ LỆ QUẢNG CÁO" />
      </div>

      <div class="row-2col">
        <div class="form-group">
          <label for="sel-decimals">Số lẻ thập phân</label>
          <select id="sel-decimals" class="form-control">
            <option value="2" selected>2 chữ số (29,34%)</option>
            <option value="1">1 chữ số (29,3%)</option>
            <option value="0">Làm tròn (29%)</option>
          </select>
        </div>
        <div class="form-group">
          <label for="inp-color">Màu chữ chính</label>
          <input id="inp-color" type="color" class="form-control" value="#1f2329" style="height:34px;padding:3px 6px;" />
        </div>
      </div>

      <label class="checkbox-line">
        <input type="checkbox" id="chk-sub" checked />
        Hiển thị dòng phụ (Tổng Ads / Tổng Doanh thu)
      </label>

      <button id="btn-save" class="btn-save">Lưu vào Dashboard</button>
    </div>
  </div>

  <script type="module">
    let sdk;
    try {
      sdk = await import('https://cdn.jsdelivr.net/npm/@lark-base-open/js-sdk@1.0.2/+esm');
    } catch (e) {
      sdk = await import('https://esm.sh/@lark-base-open/js-sdk@1.0.2');
    }

    const {
      bitable,
      DashboardState,
      Rollup,
      SourceType,
      GroupMode,
      ORDER,
      DATA_SOURCE_SORT_TYPE
    } = sdk;

    const dashboard = bitable.dashboard;
    const base = bitable.base;

    const appEl = document.getElementById('app');
    const uiTitle = document.getElementById('ui-title');
    const uiValue = document.getElementById('ui-value');
    const uiSub = document.getElementById('ui-sub');
    const uiBadge = document.getElementById('ui-badge');
    const uiError = document.getElementById('ui-error');

    const selTable = document.getElementById('sel-table');
    const selGroup = document.getElementById('sel-group');
    const selNum = document.getElementById('sel-num');
    const selDen = document.getElementById('sel-den');
    const inpTitle = document.getElementById('inp-title');
    const selDecimals = document.getElementById('sel-decimals');
    const inpColor = document.getElementById('inp-color');
    const chkSub = document.getElementById('chk-sub');
    const btnSave = document.getElementById('btn-save');

    let currentConfig = {
      tableId: '',
      groupFieldId: '',
      numFieldId: '',
      denFieldId: '',
      title: 'TỶ LỆ QUẢNG CÁO',
      decimals: 2,
      color: '#1f2329',
      showSub: true
    };

    function showError(msg) {
      if (!msg) {
        uiError.style.display = 'none';
        uiError.textContent = '';
      } else {
        uiError.style.display = 'block';
        uiError.textContent = msg;
      }
    }

    function toNumber(val) {
      if (typeof val === 'number') return Number.isFinite(val) ? val : 0;
      if (val === null || val === undefined || val === '') return 0;
      if (typeof val === 'object') {
        if ('value' in val) return toNumber(val.value);
        if (Array.isArray(val)) return val.reduce((s, x) => s + toNumber(x), 0);
      }
      const n = Number(val);
      if (Number.isFinite(n)) return n;
      const cleaned = String(val).replace(/[^0-9.-]+/g, '');
      const parsed = parseFloat(cleaned);
      return Number.isFinite(parsed) ? parsed : 0;
    }

    /**
     * Xây dựng IDataCondition chuẩn theo kiến trúc Lark-Base-Team/indicator-card:
     * BẮT BUỘC có `groups` hợp lệ để Lark Dashboard tạo `dataMeta` và cho phép Slicer liên kết.
     */
    function buildCondition(cfg) {
      const isSameField = cfg.numFieldId === cfg.denFieldId;
      const series = isSameField
        ? [{ fieldId: cfg.numFieldId, rollup: (Rollup && Rollup.SUM) ? Rollup.SUM : 'SUM' }]
        : [
            { fieldId: cfg.numFieldId, rollup: (Rollup && Rollup.SUM) ? Rollup.SUM : 'SUM' },
            { fieldId: cfg.denFieldId, rollup: (Rollup && Rollup.SUM) ? Rollup.SUM : 'SUM' }
          ];

      const condition = {
        tableId: cfg.tableId,
        dataRange: { type: (SourceType && SourceType.ALL) ? SourceType.ALL : 'ALL' },
        series
      };

      if (cfg.groupFieldId) {
        condition.groups = [
          {
            fieldId: cfg.groupFieldId,
            mode: (GroupMode && GroupMode.ENUMERATED) ? GroupMode.ENUMERATED : 'enumerated',
            sort: {
              order: (ORDER && ORDER.ASCENDING) ? ORDER.ASCENDING : 1,
              sortType: (DATA_SOURCE_SORT_TYPE && DATA_SOURCE_SORT_TYPE.VALUE) ? DATA_SOURCE_SORT_TYPE.VALUE : 'VALUE'
            }
          }
        ];
      }

      return condition;
    }

    /**
     * Cộng tổng Tử số và Mẫu số trên toàn bộ các dòng trả về từ Lark Dashboard
     * (Hỗ trợ cả bảng đã phân nhóm theo `groups` lẫn bảng không phân nhóm)
     */
    function extractTotals(data, cfg) {
      if (!Array.isArray(data) || data.length < 2) {
        return { num: 0, den: 0 };
      }

      const isSameField = cfg && cfg.numFieldId && cfg.numFieldId === cfg.denFieldId;
      const hasGroup = Boolean(cfg && cfg.groupFieldId);

      let totalNum = 0;
      let totalDen = 0;

      // Dòng 0 là Header, dữ liệu bắt đầu từ dòng 1 (giống hệt data.slice(1) trong indicator-card)
      for (let r = 1; r < data.length; r++) {
        const row = data[r];
        if (!Array.isArray(row) || row.length === 0) continue;

        if (hasGroup && row.length >= 2) {
          // row[0] = Group (VD: Tên Shop), row[1] = Series 0 (Tử số), row[2] = Series 1 (Mẫu số)
          const numVal = toNumber(row[1]?.value);
          const denVal = isSameField ? numVal : toNumber(row[2]?.value);
          totalNum += numVal;
          totalDen += denVal;
        } else {
          // Trường hợp không có cột group: row[0] = Tử số, row[1] = Mẫu số
          const numVal = toNumber(row[0]?.value);
          const denVal = (isSameField || row.length < 2) ? numVal : toNumber(row[1]?.value);
          totalNum += numVal;
          totalDen += denVal;
        }
      }

      return { num: totalNum, den: totalDen };
    }

    function renderMetric(num, den, cfg) {
      showError('');
      const title = (cfg && cfg.title) ? cfg.title : 'TỶ LỆ QUẢNG CÁO';
      const decimals = Number.isFinite(Number(cfg?.decimals)) ? Number(cfg.decimals) : 2;
      const color = cfg?.color || '#1f2329';
      const showSub = cfg?.showSub !== undefined ? Boolean(cfg.showSub) : true;

      uiTitle.textContent = title;
      uiValue.style.color = color;

      const ratio = den !== 0 ? (num / den) * 100 : 0;
      uiValue.textContent = ratio.toLocaleString('vi-VN', {
        minimumFractionDigits: decimals,
        maximumFractionDigits: decimals
      }) + '%';

      if (showSub) {
        uiSub.style.display = 'block';
        const fmtNum = Math.round(num).toLocaleString('vi-VN');
        const fmtDen = Math.round(den).toLocaleString('vi-VN');
        uiSub.textContent = `Ads: ${fmtNum} / DT: ${fmtDen}`;
      } else {
        uiSub.style.display = 'none';
      }

      if (dashboard && typeof dashboard.setRendered === 'function') {
        dashboard.setRendered();
      }
    }

    async function loadTables() {
      const tableList = await base.getTableList();
      selTable.innerHTML = '';
      let preferredId = '';

      for (const t of tableList) {
        const name = await t.getName();
        const opt = document.createElement('option');
        opt.value = t.id;
        opt.textContent = name;
        selTable.appendChild(opt);
        if (/tracking\s*all/i.test(name)) {
          preferredId = t.id;
        }
      }

      if (!currentConfig.tableId) {
        currentConfig.tableId = preferredId || (tableList[0] ? tableList[0].id : '');
      }
      selTable.value = currentConfig.tableId;
    }

    async function loadFields(tableId) {
      if (!tableId) return;
      const table = await base.getTableById(tableId);
      const fieldMetaList = await table.getFieldMetaList();

      selGroup.innerHTML = '';
      selNum.innerHTML = '';
      selDen.innerHTML = '';

      let autoGroupId = '';
      let autoNumId = '';
      let autoDenId = '';

      for (const f of fieldMetaList) {
        const optG = document.createElement('option');
        optG.value = f.id;
        optG.textContent = f.name;
        selGroup.appendChild(optG);

        const optN = document.createElement('option');
        optN.value = f.id;
        optN.textContent = f.name;
        selNum.appendChild(optN);

        const optD = document.createElement('option');
        optD.value = f.id;
        optD.textContent = f.name;
        selDen.appendChild(optD);

        const norm = f.name.trim().toLowerCase();

        // Tự động nhận diện cột phân nhóm: ưu tiên "TÊN SHOP" / "SHOP"
        if (!autoGroupId && (norm.includes('tên shop') || norm === 'shop')) {
          autoGroupId = f.id;
        }

        // Tự động nhận diện Tử số: ưu tiên "CHI PHÍ ADS BAO GỒM VAT" / "CHI PHÍ"
        if (norm.includes('chi phí ads') || norm.includes('chi phi ads')) {
          autoNumId = f.id;
        } else if (!autoNumId && (norm.includes('chi phí') || norm.includes('chi phi'))) {
          autoNumId = f.id;
        }

        // Tự động nhận diện Mẫu số: ưu tiên "DOANH THU THUẦN"
        if (norm.includes('doanh thu thuần') || norm.includes('doanh thu thuan')) {
          autoDenId = f.id;
        } else if (!autoDenId && (norm === 'nmv' || norm.includes('doanh thu'))) {
          autoDenId = f.id;
        }
      }

      const validIds = new Set(fieldMetaList.map(f => f.id));

      if (!currentConfig.groupFieldId || !validIds.has(currentConfig.groupFieldId)) {
        currentConfig.groupFieldId = autoGroupId || (fieldMetaList[0]?.id ?? '');
      }
      if (!currentConfig.numFieldId || !validIds.has(currentConfig.numFieldId)) {
        currentConfig.numFieldId = autoNumId || (fieldMetaList[0]?.id ?? '');
      }
      if (!currentConfig.denFieldId || !validIds.has(currentConfig.denFieldId)) {
        currentConfig.denFieldId = autoDenId || (fieldMetaList[Math.min(1, fieldMetaList.length - 1)]?.id ?? '');
      }

      selGroup.value = currentConfig.groupFieldId;
      selNum.value = currentConfig.numFieldId;
      selDen.value = currentConfig.denFieldId;
    }

    async function autoDetectConfigIfNeeded() {
      const tableList = await base.getTableList();
      let targetTable = tableList[0];
      for (const t of tableList) {
        const name = await t.getName();
        if (/tracking\s*all/i.test(name)) {
          targetTable = t;
          break;
        }
      }
      if (!targetTable) return;

      currentConfig.tableId = targetTable.id;
      const fields = await targetTable.getFieldMetaList();

      let gId = fields[0]?.id || '';
      let nId = fields[0]?.id || '';
      let dId = fields[1]?.id || fields[0]?.id || '';

      for (const f of fields) {
        const norm = f.name.trim().toLowerCase();
        if (norm.includes('tên shop') || norm === 'shop') gId = f.id;
        if (norm.includes('chi phí ads') || norm.includes('chi phi ads')) nId = f.id;
        if (norm.includes('doanh thu thuần') || norm.includes('doanh thu thuan')) dId = f.id;
      }

      currentConfig.groupFieldId = gId;
      currentConfig.numFieldId = nId;
      currentConfig.denFieldId = dId;
    }

    async function updatePreview() {
      try {
        currentConfig.tableId = selTable.value;
        currentConfig.groupFieldId = selGroup.value;
        currentConfig.numFieldId = selNum.value;
        currentConfig.denFieldId = selDen.value;
        currentConfig.title = inpTitle.value.trim() || 'TỶ LỆ QUẢNG CÁO';
        currentConfig.decimals = parseInt(selDecimals.value, 10) || 2;
        currentConfig.color = inpColor.value || '#1f2329';
        currentConfig.showSub = chkSub.checked;

        if (!currentConfig.tableId || !currentConfig.numFieldId || !currentConfig.denFieldId) return;

        const condition = buildCondition(currentConfig);
        const data = await dashboard.getPreviewData(condition);
        const { num, den } = extractTotals(data, currentConfig);
        renderMetric(num, den, currentConfig);
      } catch (err) {
        console.error('updatePreview error:', err);
        showError('Lỗi xem trước: ' + (err.message || String(err)));
      }
    }

    async function fetchAndRenderViewData() {
      try {
        const data = await dashboard.getData();
        uiBadge.classList.remove('visible');
        const { num, den } = extractTotals(data, currentConfig);
        renderMetric(num, den, currentConfig);
      } catch (err) {
        console.warn('getData() chưa có dataMeta, chuyển sang chế độ Preview tạm thời:', err);
        // Nếu khối chưa được bấm "Lưu vào Dashboard" lần đầu (lỗi no dataMeta),
        // tự động dò bảng TRACKING ALL và hiển thị dữ liệu qua getPreviewData để không bị lỗi đỏ
        try {
          if (!currentConfig.tableId || !currentConfig.numFieldId || !currentConfig.denFieldId) {
            await autoDetectConfigIfNeeded();
          }
          const condition = buildCondition(currentConfig);
          const previewData = await dashboard.getPreviewData(condition);
          uiBadge.classList.add('visible');
          const { num, den } = extractTotals(previewData, currentConfig);
          renderMetric(num, den, currentConfig);
        } catch (fallbackErr) {
          showError('Vui lòng bấm "..." góc phải khối -> Cấu hình -> Lưu vào Dashboard.');
        }
      }
    }

    async function init() {
      try {
        const state = dashboard.state;
        const isCreate = state === DashboardState.Create || state === 'Create';
        const isConfig = state === DashboardState.Config || state === 'Config';

        if (!isCreate) {
          try {
            const saved = await dashboard.getConfig();
            if (saved && saved.customConfig) {
              currentConfig = { ...currentConfig, ...saved.customConfig };
            }
            if (saved && Array.isArray(saved.dataConditions) && saved.dataConditions[0]) {
              const dc = saved.dataConditions[0];
              if (dc.tableId) currentConfig.tableId = dc.tableId;
              if (dc.groups?.[0]?.fieldId) currentConfig.groupFieldId = dc.groups[0].fieldId;
              if (dc.series?.[0]?.fieldId) currentConfig.numFieldId = dc.series[0].fieldId;
              if (dc.series?.[1]?.fieldId) currentConfig.denFieldId = dc.series[1].fieldId;
            }
          } catch (e) {
            console.warn('Chưa có config đã lưu:', e);
          }
        }

        if (isCreate || isConfig) {
          appEl.classList.add('is-config');
          uiBadge.classList.remove('visible');

          inpTitle.value = currentConfig.title || 'TỶ LỆ QUẢNG CÁO';
          selDecimals.value = String(currentConfig.decimals ?? 2);
          inpColor.value = currentConfig.color || '#1f2329';
          chkSub.checked = currentConfig.showSub !== false;

          await loadTables();
          await loadFields(currentConfig.tableId);
          await updatePreview();

          selTable.addEventListener('change', async () => {
            currentConfig.tableId = selTable.value;
            currentConfig.groupFieldId = '';
            currentConfig.numFieldId = '';
            currentConfig.denFieldId = '';
            await loadFields(currentConfig.tableId);
            await updatePreview();
          });

          selGroup.addEventListener('change', updatePreview);
          selNum.addEventListener('change', updatePreview);
          selDen.addEventListener('change', updatePreview);
          inpTitle.addEventListener('input', updatePreview);
          selDecimals.addEventListener('change', updatePreview);
          inpColor.addEventListener('input', updatePreview);
          chkSub.addEventListener('change', updatePreview);

          btnSave.addEventListener('click', async () => {
            btnSave.disabled = true;
            btnSave.textContent = 'Đang lưu...';
            try {
              const condition = buildCondition(currentConfig);
              await dashboard.saveConfig({
                customConfig: { ...currentConfig },
                dataConditions: [condition]
              });
            } catch (err) {
              console.error('saveConfig error:', err);
              showError('Lỗi khi lưu: ' + (err.message || String(err)));
              btnSave.disabled = false;
              btnSave.textContent = 'Lưu vào Dashboard';
            }
          });
        } else {
          appEl.classList.remove('is-config');
          await fetchAndRenderViewData();
        }

        // Tự động tính lại mỗi khi bất kỳ Slicer nào trên Dashboard thay đổi
        dashboard.onDataChange(async (res) => {
          const data = res?.data ?? res;
          if (Array.isArray(data) && data.length >= 2) {
            uiBadge.classList.remove('visible');
            const { num, den } = extractTotals(data, currentConfig);
            renderMetric(num, den, currentConfig);
          } else {
            await fetchAndRenderViewData();
          }
        });

        dashboard.onConfigChange(async (res) => {
          const cfg = res?.data ?? res;
          if (cfg?.customConfig) {
            currentConfig = { ...currentConfig, ...cfg.customConfig };
          }
          await fetchAndRenderViewData();
        });
      } catch (err) {
        console.error('Init error:', err);
        showError('Lỗi khởi tạo: ' + (err.message || String(err)));
      }
    }

    init();
  </script>
</body>
</html>
